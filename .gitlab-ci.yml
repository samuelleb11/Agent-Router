# Agent Router's pipeline. Two things leave this repository, and each keeps its own path
# through it.
#
# The VS Code extension: build the web console once (`build:ui`), build the router with it
# embedded for every supported platform, package the extension per platform, keep the VSIX
# files as artifacts, and on a `v*` tag attach them to a release and publish them where the
# tokens exist. Every platform builds in Docker on Linux, through zig, so no job needs a
# special runner: `build:linux` and `build:windows` cross-build theirs, and `build:macos`
# cross-builds both Macs' with no Apple SDK (the programs link only libSystem and libiconv).
#
# The hosted server (docs/hosting-on-kubernetes.md), in the shape the group's other apps
# use: the shared docker and rules templates, an image per commit, `latest` retagged on main,
# a deploy on main. Where it differs, it differs as Northstar's pipeline does:
#
# - The template project is named by a CI/CD variable rather than written here. This
#   repository is published, and the path to an internal project must not appear in it.
#   Set CI_TEMPLATES_PROJECT on the group or the project. (A variable in `variables:` below
#   would not work: includes are resolved before it exists.) Every pipeline needs it, the
#   extension's included, because includes are resolved before any rule is.
# - The deploy is `helm upgrade` of charts/agent-router at the commit's own image tag, not a
#   restart of `latest`, so a rollback rolls back the binary and not just the manifest.
# - Every commit on `dev` or `main` publishes the chart to this project's Helm registry,
#   packaged for that same image tag: `dev` to the dev channel, `main` to stable.
#
# Variables the pipeline reads, set in Settings -> CI/CD -> Variables:
#   CI_TEMPLATES_PROJECT  path of the shared template project
#   DEPLOY_TOKEN_USER, DEPLOY_TOKEN
#                         registry login, as the shared docker templates expect
#   AGENT_ROUTER_VALUES   FILE variable: the chart values for this cluster -- ingress host and
#                         class, TLS issuer, storage class, image pull secret. They stay out
#                         of the repository for the same reason as the above.
#   KUBE_CONTEXT          optional; the kube context to deploy with, when the cluster
#                         credentials offer more than one
#   VSCE_PAT, OVSX_PAT    optional; the Visual Studio Marketplace and Open VSX tokens. A `v*`
#                         tag publishes the extension to each store whose token is set.

include:
  - project: $CI_TEMPLATES_PROJECT
    ref: main
    file:
      - /docker/.docker-build.gitlab-ci.yml
      - /docker/.docker-tag.gitlab-ci.yml
      - /docker/.docker-tools.gitlab-ci.yml
      - /rules/.rules.gitlab-ci.yml

stages:
  - check
  - build
  - tag
  - publish
  - deploy
  - release

variables:
  # Inside the project directory, because that is the only place a cache may live. `.cargo`
  # is ignored by git and by .dockerignore, so a leftover never reaches an image's build id.
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TERM_COLOR: always
  DEPLOYMENT_ENV: production
  DEPLOYMENT_NAME: agent-router

# A push to `dev` runs the checks its change needs and nothing else; the release (every
# platform's build, the image, its tag and the chart) waits behind `package`, pressed when a
# `dev` build is wanted. On `main`, a `v*` tag and a merge request the release runs by itself.
# A newer push cancels the older pipeline: every job is interruptible but the ones that tag,
# publish and deploy. (AGEN-0120: a push to `dev` took 20 to 27 minutes, nearly all of it the
# release.)
default:
  interruptible: true

# One pipeline per change: the merge request's, or the branch's when there is none, and a
# tag's. Without this a push to a branch with an open merge request runs everything twice.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    # A `v*` tag releases and publishes the extension.
    - if: $CI_COMMIT_TAG

# The shared `.rules-docker-default` names `develop`. This repository's branch is `dev`.
.rules-agent-router:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"

# The Rust checks, on `dev` only when what they read changed: the crates, their fixtures and
# skills, the scripts they run, and the console sources and public files src/console/tests.rs
# reads.
.rules-rust-check:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
      changes:
        - src/**/*
        - Cargo.toml
        - Cargo.lock
        - build.rs
        - wrapper/**/*
        - fixtures/**/*
        - skills/**/*
        - scripts/**/*
        - ui/src/**/*
        - ui/public/**/*
        - .gitlab-ci.yml

# The console's checks, on `dev` only when the console, the contracts its specs read and the
# shared fixtures changed.
.rules-console-check:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
      changes:
        - ui/**/*
        - docs/**/*
        - fixtures/**/*
        - .gitlab-ci.yml

# The branches that publish, and the Helm channel each publishes to.
.rules-publish:
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      variables:
        HELM_CHANNEL: dev
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        HELM_CHANNEL: stable

# ---------------------------------------------------------------- check

check rust:
  stage: check
  extends: .rules-rust-check
  image: rust:1.98-bookworm
  cache:
    key:
      files: [Cargo.lock]
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
  before_script:
    - rustup component add clippy
  script:
    # `-p`, never `--workspace`: the workspace also holds the macOS menubar app, which pulls
    # in gtk on Linux. The router's build.rs asks git for the build id; this image has git.
    - cargo test -p agent-router -p claude-wrapper --locked
    # Style and complexity lints are allowed: the toolchain this job pins flags about a dozen
    # in code that predates it. Correctness, suspicious and perf lints, and every compiler
    # warning, still fail the job. There is no `cargo fmt --check` either: the tree is not
    # rustfmt-clean (hundreds of diffs, across nearly every file), and reformatting it is a
    # change of its own.
    - cargo clippy -p agent-router -p claude-wrapper --all-targets --locked -- -D warnings -A clippy::style -A clippy::complexity

# Native sidebar and full console qualification stay off the developer's Mac.
# The published extension uses its own bundled binary, matching the CLI pin.
check primary codex:
  stage: check
  extends: .rules-rust-check
  image: mcr.microsoft.com/playwright:v1.64.0-noble
  timeout: 30m
  needs: ["check console"]
  variables:
    GIT_DEPTH: "0"
  cache:
    key:
      files: [Cargo.lock, scripts/codex-sidebar/package-lock.json]
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
  before_script:
    - apt-get -qq update
    - apt-get -qq install -y curl git build-essential pkg-config python3 python3-venv xvfb xauth
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.0
    - export PATH="$CARGO_HOME/bin:$PATH"
    - npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/codex-sidebar
    - node scripts/codex-sidebar/prepare.mjs
    - export AR_SIDEBAR_SETUP="$CI_PROJECT_DIR/.ci/codex-editor/setup.json"
    - export AR_SIDEBAR_ARTIFACTS="$CI_PROJECT_DIR/.ci/codex-artifacts"
    - export CODEX_BIN=$(python3 -c 'import json,os; print(json.load(open(os.environ["AR_SIDEBAR_SETUP"]))["codexBin"])')
  script:
    - xvfb-run -a python3 scripts/measure-primary-codex.py gateway catalogue
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - .ci/codex-measurements/
      - .ci/codex-artifacts/

# Keep native control/attachment proof separate from the qualified discovery gate.
check managed codex:
  extends: check primary codex
  variables:
    GIT_DEPTH: "0"
    AR_CODEX_BASELINE: "a4d00323caafd9c1145686f1e35b8d2b4c9b307b"
  script:
    - xvfb-run -a python3 scripts/measure-primary-codex.py runtime frontends

check chart:
  stage: check
  extends: .rules-agent-router
  image:
    name: alpine/helm:4.3.0
    entrypoint: [""]
  script:
    # Each optional part, and the refusals: a chart that renders a bad configuration fails
    # an hour later, in the cluster, less clearly.
    - helm lint charts/agent-router
    - helm lint charts/agent-router --set ingress.enabled=true
    - helm lint charts/agent-router --set push.existingSecret=agent-router-push
    - >-
      helm lint charts/agent-router --set persistence.existingClaim=agent-router-data
      --set auth.existingSecret=agent-router-auth
    - >-
      ! helm template ci charts/agent-router --set auth.password=short > /dev/null 2>&1
      || { echo "a password the router refuses rendered; it must be refused"; exit 1; }
    - >-
      ! helm template ci charts/agent-router --set ingress.enabled=true --set ingress.host=
      > /dev/null 2>&1
      || { echo "an ingress with no host rendered; it must be refused"; exit 1; }
    - >-
      ! helm template ci charts/agent-router --set server.drainSeconds=620 > /dev/null 2>&1
      || { echo "a drain the pod's grace period would cut short rendered; it must be refused"; exit 1; }
    - >-
      ! helm template ci charts/agent-router --set rollout.strategy=BlueGreen > /dev/null 2>&1
      || { echo "a rollout strategy that is neither RollingUpdate nor Recreate rendered; it must be refused"; exit 1; }
    # The router runs in server mode, is given its password, and answers to its Service's
    # names. Rendered to a file first: a reader that stops at its first match can fail the
    # writer, and with it the step.
    - >-
      helm template ci charts/agent-router --namespace ci
      --show-only templates/deployment.yaml > /tmp/deployment.yaml
    - >-
      grep -qx ' *- --server' /tmp/deployment.yaml
      || { echo "the router is not started with --server"; exit 1; }
    - >-
      grep -q 'name: AGENT_ROUTER_SERVER_PASSWORD' /tmp/deployment.yaml
      || { echo "the router is not given AGENT_ROUTER_SERVER_PASSWORD"; exit 1; }
    - >-
      grep -qx ' *- --allow-host=ci-agent-router.ci.svc.cluster.local' /tmp/deployment.yaml
      || { echo "the router does not answer to its Service's names"; exit 1; }
    # A rollout with no gap: the new pod serves before the old one stops, on the old one's
    # node, and the old one keeps taking requests while the ingress lets go of it. Recreate
    # stays possible, with neither.
    - >-
      grep -qx '    type: RollingUpdate' /tmp/deployment.yaml
      && grep -qx '      maxUnavailable: 0' /tmp/deployment.yaml
      || { echo "the default rollout is not a rolling update that keeps the old pod until the new one serves"; exit 1; }
    - >-
      grep -qx ' *topologyKey: kubernetes.io/hostname' /tmp/deployment.yaml
      || { echo "a rolling update does not keep both pods on one node, where both can open the store"; exit 1; }
    - >-
      grep -qx ' *- --stop-delay-seconds=10' /tmp/deployment.yaml
      || { echo "the router is not told to keep accepting while the ingress lets go of it"; exit 1; }
    - >-
      helm template ci charts/agent-router --set rollout.strategy=Recreate
      --show-only templates/deployment.yaml > /tmp/recreate.yaml
    - >-
      grep -qx '    type: Recreate' /tmp/recreate.yaml
      && ! grep -qE 'rollingUpdate|podAffinity' /tmp/recreate.yaml
      || { echo "a Recreate rollout carries a rolling update's settings"; exit 1; }
    # What `publish chart` runs, so a packaging failure stops a merge and not a publish.
    - scripts/package-chart.sh 0 "$CI_COMMIT_SHA" registry.example.com/check/agent-router /tmp/chart

# The installer a hosted router serves Windows (src/downloads/install.ps1), parsed by
# PowerShell itself: no Windows machine runs it before a user does, and the Rust tests can
# only parse the shell one. The address it is served with stands in for the placeholder.
check installer:
  stage: check
  extends: .rules-agent-router
  needs: []
  image: mcr.microsoft.com/powershell:latest
  script:
    - sed "s|@SERVER@|'https://router.example.com'|" src/downloads/install.ps1 > /tmp/install.ps1
    - >-
      pwsh -NoProfile -Command '$e = $null;
      [System.Management.Automation.Language.Parser]::ParseFile("/tmp/install.ps1", [ref]$null, [ref]$e) | Out-Null;
      if ($e) { $e | ForEach-Object { Write-Host $_.Extent.StartLineNumber $_.Message }; exit 1 }'

# The web console (ui/), which every router binary embeds, built once. The binary jobs and the
# console check take its ui/dist through `needs`, so the Mac runner needs no pnpm, and
# scripts/build-target.sh, finding ui/dist there, does not build it again. `pnpm run build` is
# the whole build: tsc, Vite, the first load's budget and the notices check. It runs in every
# pipeline, as the binary jobs that wait on it do, and starts at once (`needs: []`); it sits in
# this stage so that the console check, here too, can take its ui/dist.
build:ui:
  stage: check
  needs: []
  rules:
    - when: on_success
  image: node:22
  before_script:
    - npm i -g pnpm@10.33.0
  script:
    - cd ui
    - pnpm install --frozen-lockfile
    - pnpm run build
  artifacts:
    paths: [ui/dist]
    expire_in: 2 weeks

# The console's own checks: lint, types, the Vitest suite (the old pages' checks are ported
# there, and the contracts each screen keeps), and the chunk and notices checks over build:ui's
# ui/dist. After the Rust checks rather than beside them: Vitest beside cargo on one runner
# timed out in Northstar's pipeline.
check console:
  stage: check
  extends: .rules-console-check
  image: node:22
  needs: [{job: "check rust", optional: true}, "build:ui"]
  before_script:
    - npm i -g pnpm@10.33.0
  script:
    - cd ui
    - pnpm install --frozen-lockfile
    - pnpm run lint
    - pnpm run typecheck
    - pnpm run test
    - pnpm run chunks:check
    - pnpm run notices:check

# ---------------------------------------------------------------- build

# The release's gate. On `dev` it waits to be pressed (allowed to stay unpressed, so a push's
# pipeline passes on its checks alone); everywhere else it passes at once. Every platform's
# build needs it, and the image, its tag and the chart need those, so pressing it builds and
# publishes this commit as every push to `dev` used to.
package:
  stage: build
  needs: []
  image: alpine:3.22
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual
      allow_failure: true
    - when: on_success
  script:
    - echo "releasing $CI_COMMIT_SHORT_SHA"

# The image builds its own console and router, and carries the machine agent the router
# hands out (src/downloads.rs): every platform's agent and editor package, from the build
# jobs below, so it waits for them. No check stage job gates it; what is published is
# gated instead (publish chart needs the checks).
build docker image:
  extends:
    - .docker-build
    - .rules-agent-router
  needs: ["build:macos", "build:linux", "build:windows"]
  before_script:
    - !reference [.docker-setup, before_script]
    - scripts/stage-agents.sh

# The extension builds in every pipeline the workflow lets through, as it did before there
# was a workflow: a job with no rules is left out of merge request pipelines. It needs only
# build:ui, whose console every binary embeds: macos, linux and windows alike take its ui/dist
# from there, and start as soon as it is built rather than after the checks, which do not gate
# them. Named so that no hidden job in the shared templates can merge into it.
.vsix-build:
  stage: build
  needs: ["build:ui", "package"]
  rules:
    - when: on_success
  cache:
    key: cargo-$CI_JOB_NAME
    paths: [.cargo/registry, target]
  # The bare agent too, which the image hands out beside the packages.
  artifacts:
    paths: [dist/*.vsix, dist/*/agent-router, dist/*/agent-router.exe]
    expire_in: 2 weeks

# Both Macs' packages, cross-built on Linux through zig with no Apple SDK: the programs link
# only libSystem and libiconv, no frameworks, and zig and cargo-zigbuild carry stubs for
# both. zig's linker signs the Apple Silicon programs ad hoc, which they need to start at
# all; build-target.sh refuses one that is not signed.
build:macos:
  extends: .vsix-build
  image: rust:1-bookworm
  before_script:
    - !reference [build:linux, before_script]
  script:
    - scripts/build-target.sh aarch64-apple-darwin
    - scripts/package-vsix.sh darwin-arm64
    - scripts/build-target.sh x86_64-apple-darwin
    - scripts/package-vsix.sh darwin-x64

build:linux:
  extends: .vsix-build
  image: rust:1-bookworm
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3-pip curl ca-certificates
    # Pinned: zig is the C compiler and the linker of every package, and a new one can
    # change what a binary links or whether a Mac one is signed.
    - pip3 install --break-system-packages cargo-zigbuild==0.23.4 ziglang==0.16.0
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs
    - rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
  script:
    - scripts/build-target.sh x86_64-unknown-linux-musl
    - scripts/package-vsix.sh linux-x64
    - scripts/build-target.sh aarch64-unknown-linux-musl
    - scripts/package-vsix.sh linux-arm64

# Windows is the GNU ABI, cross-built through zig as Linux is, so no Windows runner. Only
# the machine agent runs there (docs/hosting-machine-agent.md). Its package ships wherever
# the others do.
build:windows:
  extends: .vsix-build
  image: rust:1-bookworm
  before_script:
    - !reference [build:linux, before_script]
  script:
    - scripts/build-target.sh x86_64-pc-windows-gnu
    - scripts/package-vsix.sh win32-x64

# ---------------------------------------------------------------- tag

# On `dev` too: the chart published from `dev` names this tag, not the moving `dev` one.
tag docker image with commit:
  stage: tag
  interruptible: false
  extends:
    - .docker-setup
    - .rules-publish
  needs: [build docker image]
  script:
    - docker buildx imagetools create --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$IMAGE_TAG"

tag docker image with latest:
  interruptible: false
  extends:
    - .docker-tag-latest
    - .rules-main
  needs: [build docker image]

# ---------------------------------------------------------------- publish

# The chart, packaged for the image the job above tagged, into this project's registry:
#
#   helm repo add agent-router "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/helm/dev" \
#     --username <user> --password <a token that can read the package registry>
#
# The image registry is private as well, so a cluster installing from this needs
# imagePullSecrets, as the deploy's AGENT_ROUTER_VALUES gives it.
publish chart:
  stage: publish
  interruptible: false
  extends: .rules-publish
  needs: [tag docker image with commit, {job: "check rust", optional: true}, check chart]
  image:
    name: alpine/helm:4.3.0
    entrypoint: [""]
  before_script:
    - apk add --no-cache curl
  script:
    - PACKAGE=$(scripts/package-chart.sh "$CI_PIPELINE_IID" "$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE" chart)
    - >-
      curl --fail-with-body --user "gitlab-ci-token:$CI_JOB_TOKEN"
      --form "chart=@$PACKAGE"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/helm/api/$HELM_CHANNEL/charts"

# ---------------------------------------------------------------- deploy

deploy to production:
  stage: deploy
  interruptible: false
  # `$CI_COMMIT_BRANCH`, where the shared `.rules-main` reads `$CI_COMMIT_REF_NAME`: that is
  # `main` too in a merge request FROM main (main merged back into dev), whose pipeline has
  # no commit tag for this job to need, and GitLab would then refuse to create it.
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs: [tag docker image with commit]
  image:
    name: alpine/helm:4.3.0
    entrypoint: [""]
  environment:
    name: $DEPLOYMENT_ENV
  script:
    - >-
      helm upgrade --install "$DEPLOYMENT_NAME" charts/agent-router
      --namespace "$DEPLOYMENT_ENV" --create-namespace
      ${KUBE_CONTEXT:+--kube-context "$KUBE_CONTEXT"}
      ${AGENT_ROUTER_VALUES:+--values "$AGENT_ROUTER_VALUES"}
      --set image.repository="$CI_REGISTRY_IMAGE"
      --set image.tag="$CI_COMMIT_SHA"
      --wait --timeout 10m
    # The chart's own test: /_router/health through the Service, by IP.
    - >-
      helm test "$DEPLOYMENT_NAME" --namespace "$DEPLOYMENT_ENV" --logs
      ${KUBE_CONTEXT:+--kube-context "$KUBE_CONTEXT"}

# ---------------------------------------------------------------- release

release:
  stage: release
  interruptible: false
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs: ["build:macos", "build:linux", "build:windows"]
  script:
    - apk add --no-cache curl
    - |
      for f in dist/*.vsix; do
        name=$(basename "$f")
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/agent-router/$CI_COMMIT_TAG/$name"
      done
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Agent Router $CI_COMMIT_TAG — VS Code extension packages for macOS (Apple Silicon, Intel), Linux (x64, arm64) and Windows (x64) are in the package registry."

publish:
  stage: release
  interruptible: false
  image: node:22
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/ && ($VSCE_PAT || $OVSX_PAT)
  needs: ["build:macos", "build:linux", "build:windows"]
  script:
    - |
      for f in dist/*.vsix; do
        [ -n "$VSCE_PAT" ] && npx @vscode/vsce publish --packagePath "$f"
        [ -n "$OVSX_PAT" ] && npx ovsx publish "$f" -p "$OVSX_PAT"
      done
