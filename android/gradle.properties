org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# No `org.gradle.java.home` here on purpose: it would pin one machine's JDK path into the
# repository. Gradle uses JAVA_HOME, which scripts/device-build.sh sets to the JDK Android
# Studio ships — /usr/libexec/java_home finds none on this Mac even though `java` answers.
# Any JDK 17 or newer will do.
android.useAndroidX=true
android.nonTransitiveRClass=true
