[workspace]
members = ["menubar", "wrapper"]

[package]
name = "agent-router"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A local proxy between Claude Code and Anthropic: several accounts on one machine, and exact per-session token accounting."
repository = "https://github.com/samuelleb11/agent-router"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "time"] }
axum = "0.8"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-roots", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
ring = "0.17"
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-stream = "0.3"
socket2 = { version = "0.5", features = ["all"] }
portable-pty = "0.9"
libc = "0.2"
sha2 = "0.10"
# APNs keys arrive without their public half, which `ring` insists on; this computes it.
p256 = { version = "0.14", default-features = false, features = ["arithmetic"] }
