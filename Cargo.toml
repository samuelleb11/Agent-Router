[workspace]
members = ["menubar", "wrapper"]

[package]
name = "agent-router"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Routes coding clients across Anthropic, OpenAI and Kimi with protocol translation and per-session usage accounting."
repository = "https://github.com/samuelleb11/agent-router"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "time", "io-std", "io-util"] }
axum = { version = "0.8", features = ["ws"] }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-roots", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
ring = "0.17"
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
async-stream = "0.3"
socket2 = { version = "0.5", features = ["all"] }
portable-pty = "0.9"
libc = "0.2"
sha2 = "0.10"
# APNs keys arrive without their public half, which `ring` insists on; this computes it.
p256 = { version = "0.14", default-features = false, features = ["arithmetic"] }
# The machine agent's connection to a hosted router: a WebSocket it dials itself, over the
# same ring-based rustls the proxy uses (the crates' own TLS features would bring aws-lc).
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
# Running a tunneled request through the agent's own routes, in process.
tower = { version = "0.5", features = ["util"] }
# The web console, ui/dist, compiled into the binary (src/console.rs). `debug-embed` embeds it in
# a debug build as well, so what a test serves is what a release serves, and no build of the
# router reads a console file from disk at run time.
rust-embed = { version = "8.12", features = ["debug-embed"] }

[dev-dependencies]
# A paused clock, for what runs every fifteen minutes (`library::sync`).
tokio = { version = "1", features = ["test-util"] }

# Windows runs the machine agent: process liveness and stopping an older agent.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }
