{{- if not .Values.auth.existingSecret }}
{{- $name := include "agent-router.auth.secretName" . }}
{{- $key := .Values.auth.passwordKey }}
{{- $password := .Values.auth.password }}
{{- if not $password }}
{{- /*
  Reuse the password already in the cluster. A fresh one on every upgrade would be pinned at
  the next start, and every machine and phone holding the old one would be refused from then
  on.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data $key) }}
{{- $password = index $existing.data $key | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "agent-router.labels" . | nindent 4 }}
  annotations:
    # Outlives an uninstall, like the store does. A reinstall then pins the password every
    # machine and phone already holds instead of generating one none of them knows.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ $password | b64enc | quote }}
{{- end }}
