<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Live sessions · Agent Router</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --fg: #e6e9ef; --dim: #9aa3b2; --faint: #6b7484;
    --accent: #7aa2f7; --warn: #e0af68; --ok: #9ece6a; --ask: #bb9af7;
    /* What a session is doing, in the phones' colours so a laptop and a phone read alike:
       working green, waiting on you orange, idle gray (stalled amber, failed red). */
    --st-busy: #9ece6a; --st-wait: #ff9e64; --st-idle: #8e8e93;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #fff; --panel2: #f0f2f5; --line: #dfe3e8;
      --fg: #171a21; --dim: #5b6472; --faint: #8b94a3;
      --accent: #2d5bd7; --warn: #9a6700; --ok: #2c7a2c; --ask: #7a3fbf;
      --st-busy: #2c7a2c; --st-wait: #c2410c; --st-idle: #8e8e93;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 15px/1.5 ui-sans-serif, -apple-system, system-ui, "Segoe UI", sans-serif;
    /* A flex column pinned to the *dynamic* viewport. On iOS the URL bar showing and
       hiding changes the viewport, and `vh` does not follow it — which is what makes a
       body-scrolled page with a sticky footer lurch about. `dvh` does follow it, and
       with the panes scrolling internally the composer is simply the last row of a
       fixed-height column: it cannot drift, and nothing reflows when the bar moves. */
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    flex: none; z-index: 5;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
    padding: 10px 14px; padding-top: calc(10px + env(safe-area-inset-top));
    display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: -0.01em;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sp { flex: 1; }
  button { font: inherit; color: var(--fg); background: var(--panel2);
           border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; cursor: pointer; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .chip { font-size: 12px; color: var(--dim); background: var(--panel2); border: 1px solid var(--line);
          border-radius: 8px; padding: 6px 9px; flex: none; text-decoration: none; }

  /* ---- status pill: what the session is doing right now ----
     Coloured by the router's `tone`, the same classes as every dot below, so the header
     and the list cannot say the same thing in two colours. A class this page does not
     know leaves the plain gray pip: a word from a newer router is not an error. */
  #stat { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim);
          white-space: nowrap; flex: none; }
  #stat .pip { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  #stat.t-busy .pip { background: var(--st-busy); animation: pulse 1.1s ease-in-out infinite; }
  #stat.t-attention .pip { background: var(--st-wait); animation: pulse .8s ease-in-out infinite; }
  #stat.t-warn .pip { background: var(--warn); }
  #stat.t-error .pip { background: #e06c75; }
  #stat.t-idle .pip { background: var(--st-idle); }
  #stat.t-closed .pip { background: transparent; border: 1.5px solid var(--faint); }
  /* The stream dropped: what it last said is no longer known to be true. */
  #stat.stale { color: var(--faint); font-style: italic; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.75); } }
  @media (prefers-reduced-motion: reduce) { #stat .pip { animation: none !important; } }

  /* The three panes are interchangeable: whichever is visible owns the scroll. */
  #list, #feed, #find {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  }
  #list { padding: 12px; display: grid; grid-template-columns: minmax(0, 1fr);
          gap: 8px; align-content: start; }
  /* ---- find: the indexed history, which the feed itself cannot reach ---- */
  #find { padding: 12px; display: grid; grid-template-columns: minmax(0, 1fr);
          gap: 8px; align-content: start; }
  .findbar { position: sticky; top: -12px; z-index: 2; display: grid; gap: 8px;
             background: var(--bg); padding: 12px 0 8px; margin-top: -12px; }
  .findbar input { font: inherit; width: 100%; color: var(--fg); background: var(--panel);
                   border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .findbar input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
                         outline-offset: 1px; border-color: var(--accent); }
  .scope { display: flex; gap: 6px; }
  .scope button { font-size: 12px; padding: 5px 10px; color: var(--dim); }
  .scope button[aria-pressed="true"] { color: var(--fg); border-color: var(--accent);
                                       background: color-mix(in srgb, var(--accent) 16%, var(--panel2)); }
  .hit { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
         padding: 11px 12px; display: grid; gap: 5px; }
  .hit.open { cursor: pointer; }
  .hit.open:active { background: var(--panel2); }
  .hit .top { display: flex; gap: 8px; align-items: center; font-size: 11px; color: var(--faint); }
  .hit .tag { border: 1px solid var(--line); border-radius: 99px; padding: 1px 7px; }
  .hit .snip { font-size: 13.5px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere;
               display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  .hit mark { background: color-mix(in srgb, var(--accent) 32%, transparent); color: inherit;
              border-radius: 3px; padding: 0 2px; }
  .findnote { color: var(--dim); font-size: 12px; padding: 2px 2px 0; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 12px 13px; cursor: pointer; display: grid; gap: 5px; }
  .card:active { background: var(--panel2); }
  .row1 { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  /* One vocabulary everywhere a session is shown: list row, tab, header. The router
     names the tone; the plain gray above is what anything unnamed stays. */
  .dot.t-busy      { background: var(--st-busy); animation: pulse 1.1s ease-in-out infinite; }
  .dot.t-attention { background: var(--st-wait); animation: pulse .8s ease-in-out infinite; }
  .dot.t-idle      { background: var(--st-idle); }
  .dot.t-warn      { background: var(--warn); }
  .dot.t-error     { background: #e06c75; box-shadow: 0 0 0 3px color-mix(in srgb, #e06c75 22%, transparent); }
  /* A session whose process has gone: an empty ring, because nothing is there to be
     idle — it can be read, but nothing typed will reach it. */
  .dot.t-closed    { background: transparent; border: 1.5px solid var(--faint); }
  .dot.on { box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 25%, transparent); }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none !important; } }
  .proj { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ago { margin-left: auto; color: var(--faint); font-size: 12px; flex: none; }
  .title { color: var(--dim); font-size: 13px; overflow: hidden;
           display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .meta { color: var(--faint); font-size: 11.5px; font-family: ui-monospace, Menlo, monospace; }
  /* What the session is doing, in the router's words. Only what needs a reader is
     coloured; the dot already carries the rest. */
  .doing { color: var(--dim); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis;
           white-space: nowrap; }
  .doing.t-attention { color: var(--st-wait); }
  .doing.t-warn { color: var(--warn); }
  .doing.t-error { color: #e06c75; }
  .wrap-tag { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; border-radius: 999px;
              padding: 1px 7px; border: 1px solid currentColor; flex: none; }
  .wrap-tag.on { color: var(--ok); }
  .wrap-tag.off { color: var(--faint); }
  /* Older sessions fold away: the list is for what you are working on now. */
  /* Project headings: the list is mostly "which of my projects is moving". */
  .grp { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint);
         padding: 12px 2px 2px; display: flex; align-items: center; gap: 7px; }
  .grp:first-child { padding-top: 0; }
  .grp .n { color: var(--dim); font-size: 10.5px; }
  .grp .when { margin-left: auto; text-transform: none; letter-spacing: 0; font-size: 11px; }
  .grp .dot { width: 6px; height: 6px; }
  #older, #shelf { margin-top: 4px; }
  #shelf > summary { cursor: pointer; color: var(--faint); font-size: 12.5px; padding: 8px 2px;
                     list-style: none; }
  #shelf > summary::-webkit-details-marker { display: none; }
  #shelf > summary::before { content: '▸ '; }
  #shelf[open] > summary::before { content: '▾ '; }
  #shelf > div { display: grid; gap: 8px; }
  #older > summary { cursor: pointer; color: var(--dim); font-size: 12.5px; padding: 8px 2px; list-style: none; }
  #older > summary::-webkit-details-marker { display: none; }
  #older > summary::before { content: '▸ '; }
  #older[open] > summary::before { content: '▾ '; }
  #older > div { display: grid; gap: 8px; }

  /* ---- transcript ----
     A conversation, not a log. Assistant prose sits on the page with no chrome so it
     reads as text; the user's own words get the only filled bubble, because "what did
     I ask?" is the question you scan for. Everything else — tools, thinking — is
     apparatus and recedes. */
  #feed { padding: 14px 12px 10px; display: grid; grid-template-columns: minmax(0, 1fr);
          gap: 2px; align-content: start; }
  /* min-width:0 for the same reason the column needs min-height:0: a grid item
     defaults to min-width:auto, so a wide <pre> stretches the track instead of
     scrolling inside it, and the whole page ends up scrolling sideways. */
  .ev { border-radius: 12px; padding: 2px 2px; min-width: 0; }
  .ev > * { min-width: 0; }
  .ev .who { font-size: 10.5px; letter-spacing: .04em; color: var(--faint);
             margin-bottom: 3px; display: flex; gap: 7px; align-items: baseline; }
  .ev .dur { margin-left: auto; }
  .ev pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere;
            font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* The user's turn: the one thing with a fill. */
  .ev.user {
    justify-self: end; max-width: min(85%, 40em);
    background: var(--accent); color: #fff;
    padding: 9px 13px; margin: 12px 0 4px;
  }
  .ev.user .who { display: none; }
  .ev.user pre { font-family: inherit; font-size: 14.5px; color: #fff; }
  .ev.user.pending { opacity: .55; background: transparent; color: var(--fg);
                     border: 1px dashed var(--accent); }
  .ev.user.pending pre { color: var(--fg); }
  .ev.user.pending .who { display: block; color: var(--faint); }

  /* The assistant's turn: no card at all. */
  .ev.assistant-text { padding: 4px 4px 10px; max-width: 46em; }
  .ev.assistant-text .who { display: none; }

  /* Apparatus, on a rail. */
  .ev.tool_use, .ev.tool_result, .ev.thinking, .ev.other {
    border-left: 2px solid var(--line); padding: 3px 0 3px 11px; margin-left: 3px;
  }
  .ev.tool_use { padding-top: 8px; }
  .ev.tool_use .name { color: var(--accent); font-weight: 600; font-size: 12px; }

  /* A command and its output are one thing, so they share a block and the output
     hangs directly off the command with no gap to read across. */
  .term { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-top: 4px;
          max-width: 100%; }
  .term .cmd, .term .out {
    margin: 0; padding: 7px 10px; overflow-x: auto; overflow-y: hidden;
    /* No wrapping: a wrapped path or flag is harder to read than a scrolled one. */
    white-space: pre; overflow-wrap: normal;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .term .cmd { background: var(--panel2); color: var(--fg); }
  .term .cmd::before { content: '$ '; color: var(--accent); }
  .term.plain .cmd::before { content: ''; }
  .term .out { background: var(--panel); color: var(--dim); border-top: 1px solid var(--line);
               white-space: pre-wrap; overflow-wrap: anywhere; }
  .term .out:empty { display: none; }
  .term .lbl { font-size: 9.5px; letter-spacing: .05em; color: var(--faint);
               padding: 3px 10px 0; background: var(--panel); }
  .ev.thinking .who { margin: 0; cursor: pointer; font-style: italic; }
  .ev.thinking pre { display: none; margin-top: 5px; color: var(--dim); font-style: italic; }
  .ev.thinking.open pre { display: block; }
  .ev.sidechain { border-left-color: var(--warn); }

  /* A question is the one thing worth interrupting the flow for. */
  .ev.ask { border: 1px solid var(--ask); background: color-mix(in srgb, var(--ask) 10%, var(--panel));
            padding: 11px 13px; margin: 12px 0; max-width: 46em; }
  .ev.ask .q { font-weight: 600; margin: 6px 0 8px; font-size: 14.5px; }
  .ev.ask .hdr { display: inline-block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
                 color: var(--ask); border: 1px solid var(--ask); border-radius: 999px; padding: 1px 7px; }
  .tabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--line);
          margin: 4px 0 10px; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0;
         padding: 6px 9px; font-size: 12.5px; color: var(--dim); cursor: pointer; }
  .tab.on { color: var(--fg); border-bottom-color: var(--ask); font-weight: 600; }
  .tab .mark { color: var(--ok); margin-left: 5px; }
  .pane { display: none; }
  .pane.on { display: block; }
  .opt { display: flex; gap: 9px; align-items: flex-start; border: 1px solid var(--line);
         border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; background: var(--panel);
         cursor: pointer; }
  .opt:hover { border-color: var(--ask); }
  .opt input { margin: 2px 0 0; accent-color: var(--ask); flex: none; }
  .opt .txt { min-width: 0; }
  .opt.picked { border-color: var(--ask); background: color-mix(in srgb, var(--ask) 12%, var(--panel)); }
  .opt .free { width: 100%; margin-top: 5px; font: inherit; font-size: 13px; color: var(--fg);
               background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .ask-foot { display: flex; gap: 9px; align-items: center; margin-top: 9px; }
  .ask-foot .btn { background: var(--ask); border-color: var(--ask); color: #16091f; font-weight: 600; }
  .ask-hint { font-size: 11.5px; color: var(--dim); }
  .ev.ask.done { opacity: .55; }
  .opt b { font-size: 13.5px; }
  .opt span { display: block; color: var(--dim); font-size: 12.5px; margin-top: 2px; }
  .ev.answer { border-left: 2px solid var(--ok); padding: 3px 0 3px 11px; margin-left: 3px; }
  /* A cancellation is something that happened, not something anyone said. */
  .ev.interrupt { text-align: center; padding: 6px 0; }
  .ev.interrupt pre { display: inline; font-family: inherit; font-size: 11.5px; color: var(--faint);
                      font-style: italic; }
  .ev.interrupt .who { display: none; }
  .ev.answer pre { color: var(--dim); font-size: 12px; }

  /* A session blocked on a permission request. Above the composer because it is the
     thing to deal with first: nothing typed below will run until it is answered. */
  #perm:empty { display: none; }
  #perm {
    border: 1px solid var(--warn, #b7791f); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px; background: color-mix(in srgb, var(--warn, #b7791f) 10%, transparent);
  }
  #perm .what { font-weight: 600; margin-bottom: 2px; }
  #perm .also { font-size: 12px; opacity: .8; margin-bottom: 2px; }
  #perm code { display: block; overflow-x: auto; white-space: pre-wrap; word-break: break-word;
               font-size: 12px; margin: 6px 0; opacity: .85; }
  #perm .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  #perm button { padding: 5px 10px; border-radius: 8px; font-size: 13px; }
  #perm .deny { opacity: .85; }

  /* ---- composer ---- */
  #composer {
    flex: none; background: var(--bg); border-top: 1px solid var(--line);
    padding: 10px 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
    display: grid; gap: 7px;
  }
  .cbox { display: flex; gap: 8px; align-items: flex-end; }
  #msg { flex: 1; resize: none; font: inherit; color: var(--fg); background: var(--panel);
         border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; max-height: 120px; }
  #msg:disabled { color: var(--faint); }
  /* A notice sits above the box it is about, framed, and can be dismissed — the same
     shape the editor uses for its own notices. */
  #note {
    display: none; align-items: flex-start; gap: 10px;
    font-size: 12px; line-height: 1.45; color: var(--warn);
    background: color-mix(in srgb, var(--warn) 12%, var(--bg));
    border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent);
    border-radius: 9px; padding: 9px 11px;
  }
  #note.show { display: flex; }
  #note.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--bg));
             border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  #note .x { margin-left: auto; cursor: pointer; opacity: .7; flex: none; padding: 0 2px; }
  #note .x:hover { opacity: 1; }
  /* Stop takes the send button's place while a turn is running, as in the real UI. */
  #stop { background: var(--warn); border-color: var(--warn); color: #1a1200; font-weight: 600; }
  .ev.pending { opacity: .6; border-style: dashed; border-left: 3px solid var(--accent); }
  /* A thin facts strip under the header: model, effort, spend. */
  #facts { flex: none; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline;
           padding: 6px 14px; border-bottom: 1px solid var(--line); background: var(--panel2);
           font-size: 11.5px; color: var(--dim); }
  #facts b { color: var(--fg); font-weight: 600; }
  #facts .proj-tot { margin-left: auto; padding-left: 12px; color: var(--faint); }
  #facts .proj-tot b { color: var(--dim); }
  #facts .money { color: var(--warn); }
  #facts .sep { color: var(--faint); }
  /* ---- folding ---- */
  .clamp { position: relative; max-height: 11em; overflow: hidden !important; }
  .clamp::after { content: ''; position: absolute; inset: auto 0 0 0; height: 3em;
                  background: linear-gradient(transparent, var(--bg)); pointer-events: none; }
  .ev.user .clamp::after { background: linear-gradient(transparent, var(--accent)); }
  .term .out.clamp::after { background: linear-gradient(transparent, var(--panel)); }
  .term .cmd.clamp::after { background: linear-gradient(transparent, var(--panel2)); }
  /* Four lines is enough to recognise a command or see the head of its output;
     anything longer is opened deliberately. 1.5 line-height at 12px. */
  .term .clamp { max-height: 6em; }
  .more { display: block; font-size: 11.5px; color: var(--accent); cursor: pointer;
          user-select: none; margin-top: 5px; }
  .term .more { padding: 4px 10px 6px; margin: 0; background: var(--panel); }

  /* ---- markdown ---- */
  .md { font-size: 14.5px; white-space: normal; font-family: inherit; }
  .md pre.code { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
                 padding: 9px 11px; overflow-x: auto; margin: 7px 0; white-space: pre;
                 font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .md code { background: var(--panel2); border-radius: 4px; padding: 1px 4px;
             font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .md ul { margin: 6px 0; padding-left: 20px; }
  .md li { margin: 2px 0; }
  .md h3 { font-size: 14.5px; margin: 9px 0 4px; }
  .md p { margin: 6px 0; }
  .md p:first-child { margin-top: 0; }
  .md p:last-child { margin-bottom: 0; }
  .md h4, .md h5, .md h6 { font-size: 13.5px; margin: 8px 0 4px; }
  .md a { color: var(--accent); }
  .md blockquote { margin: 6px 0; padding-left: 10px; border-left: 2px solid var(--line);
                   color: var(--dim); }
  /* Tables scroll rather than widen the column, same rule as terminal blocks. */
  .md table { display: block; overflow-x: auto; max-width: 100%; border-collapse: collapse;
              margin: 8px 0; font-size: 13px; }
  .md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left;
                   vertical-align: top; white-space: nowrap; }
  .md th { background: var(--panel2); font-weight: 600; }

  /* Sessions of one project, as tabs. Ordered by when they began, never by activity:
     ordering by activity moves a tab out from under the cursor mid-click. */
  #tabs { flex: none; display: flex; gap: 2px; overflow-x: auto; padding: 0 10px;
          border-bottom: 1px solid var(--line); background: var(--panel2); }
  #tabs::-webkit-scrollbar { height: 0; }
  #tabs .stab { display: flex; align-items: center; gap: 6px; flex: none; cursor: pointer;
                background: none; border: 0; border-bottom: 2px solid transparent;
                border-radius: 0; padding: 8px 10px; font-size: 12.5px; color: var(--dim);
                max-width: 15em; white-space: nowrap; }
  #tabs .stab .lbl { overflow: hidden; text-overflow: ellipsis; }
  #tabs .stab.on { color: var(--fg); border-bottom-color: var(--accent); }
  #tabs .stab:hover { color: var(--fg); }
  #tabs .stab .put { opacity: 0; padding: 0 1px; color: var(--faint); }
  #tabs .stab:hover .put, #tabs .stab.on .put { opacity: .65; }
  #tabs .stab .put:hover { opacity: 1; color: var(--fg); }
  .card.archived { opacity: .55; }
  .empty { color: var(--faint); text-align: center; padding: 40px 20px; }
  .hide { display: none !important; }
.sw { font: inherit; font-size: 12px; padding: 1px 4px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: inherit; max-width: 46vw; }
</style>

<header>
  <a id="home" class="chip" href="/" title="Back to the dashboard">‹ Dashboard</a>
  <button id="back" class="hide">‹</button>
  <h1 id="heading">Live sessions</h1>
  <span class="sp"></span>
  <button id="findBtn" class="chip" title="Search everything this router has recorded">Find</button>
  <span id="stat"><span class="pip"></span><span id="statText"></span></span>
</header>

<div id="tabs" class="hide"></div>
<div id="facts" class="hide"></div>
<div id="list"></div>
<div id="feed" class="hide"></div>
<div id="find" class="hide">
  <div class="findbar">
    <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="A word, a phrase, an identifier">
    <div class="scope" id="scope">
      <button data-s="session" aria-pressed="true">This session</button>
      <button data-s="all" aria-pressed="false">Everywhere</button>
    </div>
  </div>
  <div id="findRows"></div>
</div>

<div id="composer" class="hide">
  <div id="perm"></div>
  <div id="note"></div>
  <div class="cbox">
    <textarea id="msg" rows="1" placeholder="Send a message to this session…"></textarea>
    <button id="send">Send</button>
    <button id="stop" class="hide" title="Stop this turn">■</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const list = $('#list'), feed = $('#feed'), back = $('#back'), heading = $('#heading');
const stat = $('#stat'), statText = $('#statText'), composer = $('#composer');
const msg = $('#msg'), sendBtn = $('#send'), note = $('#note'), stopBtn = $('#stop');
const facts = $('#facts'), home = $('#home'), tabs = $('#tabs');
let es = null, current = null, listScroll = 0, following = true, watcher = null, pinTo = null;
// What a session can be switched to; one list for every UI, from the router.
let options = { models: [], efforts: [] };
fetch('/api/live/options').then(r => r.json()).then(o => { options = o; }).catch(() => {});
// Pinning twice — now and after layout settles — costs nothing and covers the frame
// in which a row changes height.
// Show a notice above the composer, dismissible, optionally self-clearing. Text is set
// as textContent, never markup: some of these carry a server-supplied reason.
let noteTimer = 0;
function say(text, opts = {}) {
  clearTimeout(noteTimer);
  note.textContent = '';
  if (!text) { note.className = ''; return; }
  note.className = 'show' + (opts.ok ? ' ok' : '');
  const body = document.createElement('span');
  body.textContent = text;
  const x = document.createElement('span');
  x.className = 'x';
  x.textContent = '✕';
  x.title = 'Dismiss';
  x.onclick = () => say('');
  note.append(body, x);
  if (opts.for) noteTimer = setTimeout(() => say(''), opts.for);
}

function pin() {
  feed.scrollTop = feed.scrollHeight;
  requestAnimationFrame(() => { if (following) feed.scrollTop = feed.scrollHeight; });
}
// Sent messages, newest last. -1 means "composing", not browsing.
// NOT named `history`: that shadows window.history, and pushState then throws inside
// openSession, which silently stops every card in the list from opening.
let sent = [], histAt = -1, histDraft = '';

const dur = ms => ms < 1000 ? Math.round(ms) + 'ms'
  : ms < 60000 ? (ms / 1000).toFixed(ms < 10000 ? 1 : 0) + 's'
  : Math.round(ms / 60000) + 'm';
// A stretch of time the way it is glanced at: 12s, 5m, 3h, 2d.
const span = ms => {
  const s = Math.max(0, ms / 1000);
  return s < 60 ? Math.round(s) + 's' : s < 3600 ? Math.round(s / 60) + 'm'
    : s < 86400 ? Math.round(s / 3600) + 'h' : Math.round(s / 86400) + 'd';
};
const ago = ms => span(Date.now() - ms);
const fetchSessions = () => fetch('/api/live/sessions').then(r => r.json()).catch(() => []);
// Cents matter at coffee prices and are noise at four figures.
const usd = n => n == null ? ''
  : n >= 1000 ? '$' + Math.round(n).toLocaleString()
  : n >= 1 ? '$' + n.toFixed(2)
  : '$' + n.toFixed(3);
const num = n => n >= 1e9 ? (n / 1e9).toFixed(1) + 'B'
  : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M'
  : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n || 0);
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const base = p => (p || '').split('/').filter(Boolean).pop() || p || '—';

// ---------- what a session is doing ----------
// The router works that out once, for every surface, and says it three ways: `activity`
// (what it is doing), `tone` (its colour, chosen there so that every client colours
// alike) and `detail` (the words). This page only renders them. An older router sent
// only `state`, in one of two vocabularies — the list's working|ask|idle|stalled|failed,
// the stream's working|tool|ask|idle|failed — and a payload from one still has to read
// exactly as it always did. A word neither table knows stays the plain gray dot: a newer
// router saying something this page has not heard of is not an error.
const TONES = new Set(['busy', 'attention', 'warn', 'error', 'idle', 'closed']);
const ACTIVITY_TONE = new Map(Object.entries({
  generating: 'busy', tool: 'busy', background: 'busy', waiting: 'attention',
  stalled: 'warn', failed: 'error', idle: 'idle', closed: 'closed' }));
const STATE_TONE = new Map(Object.entries({
  working: 'busy', tool: 'busy', ask: 'attention', stalled: 'warn', failed: 'error', idle: 'idle' }));
function toneOf(x) {
  if (!x) return '';
  if (TONES.has(x.tone)) return x.tone;
  if (x.activity != null) return ACTIVITY_TONE.get(x.activity) || '';
  return STATE_TONE.get(x.state) || '';
}
const toneClass = x => { const t = toneOf(x); return t ? 't-' + t : ''; };
// Busy: a turn, or background work a finished turn left running. Stalled is still busy —
// the process says it is working; only nothing has shown for a while.
const BUSY = new Set(['generating', 'tool', 'background', 'stalled']);
const knows = x => !!x && ACTIVITY_TONE.has(x.activity);
/// Busy, or waiting on you: what `active` means, and what keeps a session counted, out of
/// "older" and in the tabs. Read off the activity when this page knows it; otherwise the
/// router's own `active` — which from an older router meant only "its file moved in the
/// last two minutes", and is still all such a payload can say.
const isLive = r => knows(r) ? BUSY.has(r.activity) || r.activity === 'waiting' : !!r.active;
/// Whether Stop means anything. Only a running turn can be stopped. While nothing but
/// background agents or workflows run there is no turn, and what an interrupt does to
/// the results they have yet to deliver is unmeasured — so it is not offered, and the
/// router refuses it for the older clients that still would. An activity this page does
/// not know is not stoppable either: a missing button beats one that stops the wrong thing.
const stoppable = s => !!s && (s.activity != null
  ? ['generating', 'tool', 'stalled'].includes(s.activity)
  : s.state === 'tool' || s.state === 'working');
/// What it is doing, and for how long: `detail` plus the time since `since_ms` —
/// "Waiting for you · 1h" — or for a closed session how long ago it ended, "Session
/// ended · 3h ago". Every activity, idle included; the phones say it the same way. Worked
/// out here from the router's timestamps rather than sent as text, which would change
/// every second — and only ever against the router's own clock (`as_of_ms`), never this
/// one: a laptop or phone whose clock is off would shift every duration, so a payload
/// without the router's clock gets no duration rather than a wrong one. A status also
/// carries `quiet_ms`, the router's own measure, which is all an older router sent. The
/// first few seconds go unsaid: "Thinking · 2s" is a number that only flickers.
function doing(x, min = 4000) {
  if (!x || !x.detail) return '';
  const now = x.as_of_ms;
  if (x.activity === 'closed') {
    return now != null && x.ended_ms != null ? `${x.detail} · ${span(now - x.ended_ms)} ago` : x.detail;
  }
  const t = now != null && x.since_ms != null ? now - x.since_ms : x.quiet_ms;
  return x.detail + (t > min ? ' · ' + span(t) : '');
}
/// A project heading's dot: the most pressing of its sessions. Waiting on you first, then
/// a turn that failed, then one that has stopped making progress — each a thing to go and
/// look at — then work under way, then a session open and idle; the empty ring only once
/// every one of them has ended. The phones rank a project the same way, so it reads alike
/// on every screen. A word this page does not know outranks nothing, and has not ended
/// either: a project with nothing else open gets the plain gray dot, like its rows ('').
/// Rows from an older router carry no activity, and the heading then says what it always
/// did: something in this project moved lately, or nothing did.
const GROUP_RANK = ['attention', 'error', 'warn', 'busy', 'idle'];
function groupTone(items) {
  if (!items.some(r => r.activity != null)) return items.some(r => r.active) ? 'busy' : 'idle';
  const tones = new Set(items.map(toneOf));
  for (const t of GROUP_RANK) if (tones.has(t)) return t;
  return items.every(r => toneOf(r) === 'closed') ? 'closed' : '';
}

// What the open session's stream last said, while it is connected. The open tab shows
// the same thing, so the header and the tab beside it cannot disagree.
let lastStatus = null, promptCue = null;
function setStatus(s) {
  lastStatus = s;
  stat.className = toneClass(s);
  // Send stays: a message typed while a turn runs is queued by the session itself and
  // taken up when the turn ends. Stop appears beside it only while a turn is running —
  // see `stoppable` — and an unwrapped session keeps it and finds out on click.
  stopBtn.classList.toggle('hide', !stoppable(s));
  openTabDot();
  if (!s) { statText.textContent = ''; return; }
  const queued = s.queued ? ` · ${s.queued} queued` : '';
  statText.textContent = doing(s) + queued;
  // A prompt the stream reports is drawn now, rather than on the next two-second poll.
  const rid = s.waiting_on && s.waiting_on.request_id;
  if (rid && rid !== promptCue) { promptCue = rid; pollPrompt(); }
}

/// The stream dropped, or has not answered yet. What it last said is no longer known to
/// be true, so it does not stay on screen looking current: the header says so, the pip
/// goes gray, and Stop goes — a stop aimed at a picture that may be minutes old could
/// land on a turn nobody has seen.
function markStale(text) {
  lastStatus = null;
  stat.className = 'stale';
  statText.textContent = text;
  stopBtn.classList.add('hide');
  openTabDot();
}

/// The open tab's dot, by the rule drawTabs draws it with: what the stream says while it
/// vouches for anything, and what the list last read while it does not — applied the
/// moment the stream's word changes rather than at the next list refresh, so the tab
/// never goes on claiming what the header beside it has stopped claiming.
function openTabDot() {
  const dot = current && tabs.querySelector('.stab.on .dot');
  if (!dot) return;
  const row = allRows.find(x => x.session_id === current.session_id) || current;
  dot.className = 'dot ' + toneClass(lastStatus || row);
}

let allRows = [];
// A session belongs on screen if it has moved recently, or is doing something now.
// Archiving hides it — until it shows life again, because putting something away says
// "I am done with this", not "never show me this". The router decides that: `archived`
// arrives already meaning "put away, and quiet ever since", so a session you just
// finished with goes at once and comes back by itself if it starts up again. Testing it
// here against a window instead would hide nothing, the session having moved a moment
// before you put it away.
const TAB_WINDOW_MS = 12 * 3600 * 1000;
const isCurrent = (r) => isLive(r) || r.state === 'working' || r.state === 'ask'
  || (Date.now() - r.last_activity_ms) <= TAB_WINDOW_MS;
const onScreen = (r) => !r.archived;
// Every five seconds, and whenever the list comes back. With a session open, only the
// tab strip over it is redrawn — its dots are the other sessions' states, and a sibling
// that starts working or asking has to show it without the reader leaving and coming
// back — and the header is left alone: it belongs to the open session's own stream.
async function loadSessions() {
  let rows = [];
  try { rows = await (await fetch('/api/live/sessions')).json(); }
  catch (e) {
    if (!current) { stat.className = ''; statText.textContent = 'offline · ' + ((e && e.message) || 'no reply'); }
    return;
  }
  allRows = rows;
  if (current) {
    // The find pane hides the tabs; they are redrawn when it closes.
    if (!findOpen) drawTabs(current);
    return;
  }
  // An extension update ships a fresh, unwrapped binary, and every session it starts is
  // view-only with nothing to say so. Say so here, where the reader will be wondering.
  const shim = await fetch('/api/setup/shim').then(r => r.json()).catch(() => null);
  const newest = shim && Array.isArray(shim.targets) && shim.targets.length
    ? shim.targets[shim.targets.length - 1] : null;
  const lastMoved = () => rows.length
    ? 'idle · ' + ago(Math.max(...rows.map(r => r.last_activity_ms))) : 'nothing yet';
  if (rows.some(r => r.activity != null)) {
    // Counted off the activity, so a closed session — neither busy nor waiting — is
    // never one of them, and a session waiting on you is told apart from one at work.
    const working = rows.filter(r => BUSY.has(r.activity)).length;
    const waiting = rows.filter(r => r.activity === 'waiting').length;
    stat.className = waiting ? 't-attention' : working ? 't-busy' : 't-idle';
    statText.textContent = [working && working + ' working', waiting && waiting + ' waiting']
      .filter(Boolean).join(' · ') || lastMoved();
  } else {
    // An older router: `active` is all it can say, so the header says what it always did.
    const live = rows.filter(r => r.active).length;
    stat.className = live ? 't-busy' : 't-idle';
    statText.textContent = live ? live + ' active' : lastMoved();
  }
  list.innerHTML = rows.length ? '' : '<div class="empty">No sessions in the last week.</div>';
  if (newest && newest.state !== 'installed') {
    const n = document.createElement('div');
    n.className = 'empty';
    n.textContent = `${newest.extension} is not wrapped — sessions it starts are view-only until the ` +
      `wrapper is installed from the dashboard's Settings.`;
    list.prepend(n);
  }

  const card = (r) => {
    const el = document.createElement('div');
    el.className = 'card';
    const line = doing(r);
    el.innerHTML =
      `<div class="row1"><span class="dot ${toneClass(r)} ${isLive(r) ? 'on' : ''}"></span>` +
      `<span class="proj">${esc(r.title ? (r.git_branch || r.session_id.slice(0, 8)) : (base(r.cwd) || r.project))}</span>` +
      `<span class="wrap-tag ${r.wrapped ? 'on' : 'off'}" title="${r.wrapped
        ? 'Can take a typed message and a stop' : 'Read-only — start it after installing the wrapper'}">` +
      `${r.wrapped ? 'live' : 'view'}</span>` +
      `<span class="ago">${ago(r.last_activity_ms)}</span></div>` +
      (r.title ? `<div class="title">${esc(r.title)}</div>` : '') +
      (line ? `<div class="doing ${toneClass(r)}">${esc(line)}</div>` : '') +
      `<div class="meta">${esc(r.session_id.slice(0, 8))}${r.git_branch ? ' · ' + esc(r.git_branch) : ''}</div>`;
    el.onclick = () => openSession(r);
    return el;
  };

  // Grouped by project, each group led by its most recent session — so the project
  // you touched last is at the top, which is the order you actually look in.
  const groupInto = (target, rows) => {
    const byProject = new Map();
    for (const r of rows) {
      const k = base(r.cwd) || r.project;
      if (!byProject.has(k)) byProject.set(k, []);
      byProject.get(k).push(r);
    }
    // Projects alphabetically, so a project keeps its place in the list instead of
    // jumping to the top whenever it moves; sessions inside newest first, because
    // within one project recency is what you are choosing between.
    for (const project of [...byProject.keys()].sort((a, b) => a.localeCompare(b))) {
      const items = byProject.get(project).sort((a, b) => b.last_activity_ms - a.last_activity_ms);
      const live = items.some(isLive);
      const newest = Math.max(...items.map(r => r.last_activity_ms));
      const tone = groupTone(items);
      const h = document.createElement('div');
      h.className = 'grp';
      h.innerHTML = `<span class="dot ${tone ? 't-' + tone : ''} ${live ? 'on' : ''}"></span>` +
        `<span>${esc(project)}</span><span class="n">${items.length}</span>` +
        `<span class="when">${ago(newest)}</span>`;
      target.appendChild(h);
      for (const r of items) target.appendChild(card(r));
    }
  };

  const now = Date.now();
  const shelved = rows.filter(r => r.archived);
  const rest = rows.filter(r => !shelved.includes(r));
  // Older means quiet for twelve hours — but never a session that is busy or waiting on
  // you. Nothing is written to a transcript while it waits, so one blocked on a question
  // for half a day would fold away as "older" at exactly the moment it most needs finding.
  const older = rest.filter(r => now - r.last_activity_ms > TAB_WINDOW_MS && !isLive(r));
  const recent = rest.filter(r => !older.includes(r));
  groupInto(list, recent);

  if (older.length) {
    // <details> keeps its own open state across the 5s refresh, so a section the
    // reader opened does not snap shut under them.
    const wasOpen = document.getElementById('older')?.open;
    const d = document.createElement('details');
    d.id = 'older';
    if (wasOpen) d.open = true;
    d.innerHTML = `<summary>${older.length} older session${older.length > 1 ? 's' : ''}</summary><div></div>`;
    const box = d.querySelector('div');
    groupInto(box, older);
    list.appendChild(d);
  }

  if (shelved.length) {
    const wasOpen = document.getElementById('shelf')?.open;
    const d = document.createElement('details');
    d.id = 'shelf';
    if (wasOpen) d.open = true;
    d.innerHTML = `<summary>${shelved.length} archived</summary><div></div>`;
    const box = d.querySelector('div');
    for (const r of shelved) {
      const c = card(r);
      c.classList.add('archived');
      // Clicking opens it; the label brings it back to the list for good.
      const back = document.createElement('span');
      back.className = 'more';
      back.textContent = 'Restore';
      back.onclick = (e) => { e.stopPropagation(); putAway(r, false); };
      c.appendChild(back);
      box.appendChild(c);
    }
    list.appendChild(d);
  }
}

// Escape first, then add our own tags — content comes from transcripts, so nothing
// from the session is ever interpreted as markup.
function md(src) {
  const blocks = [];
  let t = esc(src).replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
    '\u0000' + (blocks.push(`<pre class="code">${code.replace(/\n$/, '')}</pre>`) - 1) + '\u0000');
  t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>')
       .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
       .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<i>$2</i>')
       .replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out = [];
  let list = null, table = null;
  const cells = (line) => line.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());
  const flushTable = () => {
    if (!table) return;
    const [head, ...body] = table;
    out.push('<table><thead><tr>' + head.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>' +
      body.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('') + '</tbody></table>');
    table = null;
  };
  const lines = t.split('\n');
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trimEnd();
    const bullet = line.match(/^\s*[-*]\s+(.*)$/);
    const num = line.match(/^\s*\d+[.)]\s+(.*)$/);
    const head = line.match(/^(#{1,6})\s+(.*)$/);
    const quote = line.match(/^&gt;\s?(.*)$/);
    // A table is a header row followed by a |---|---| separator; without that a line
    // of pipes is just prose and must stay prose.
    const isRow = /^\s*\|.*\|\s*$/.test(line);
    const isRule = /^\s*\|[\s:|-]+\|\s*$/.test(line);
    if (isRow && !table && /^\s*\|[\s:|-]+\|\s*$/.test((lines[i + 1] || '').trimEnd())) {
      table = [cells(line)]; i++; continue;
    }
    if (table) {
      if (isRow && !isRule) { table.push(cells(line)); continue; }
      flushTable();
    }
    if (bullet || num) { (list ??= []).push(`<li>${(bullet || num)[1]}</li>`); continue; }
    if (list) { out.push(`<ul>${list.join('')}</ul>`); list = null; }
    if (head) { const n = Math.min(head[1].length + 2, 6); out.push(`<h${n}>${head[2]}</h${n}>`); }
    else if (quote) out.push(`<blockquote>${quote[1]}</blockquote>`);
    else if (line.trim()) out.push(`<p>${line}</p>`);
  }
  if (list) out.push(`<ul>${list.join('')}</ul>`);
  flushTable();
  return out.join('').replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[i]);
}

// Fold anything tall behind a toggle rather than cutting it off.
function clampable(el) {
  const body = el.querySelector('.term .out, .term .cmd, pre, .md');
  if (!body) return el;
  // Clamp first, then measure: an unclamped element always reports
  // scrollHeight === clientHeight, so measuring before this never folded anything.
  body.classList.add('clamp');
  requestAnimationFrame(() => {
    if (body.scrollHeight <= body.clientHeight + 4) {
      body.classList.remove('clamp');
      return;
    }
    const more = document.createElement('span');
    more.className = 'more';
    const lines = Math.round(body.scrollHeight / parseFloat(getComputedStyle(body).lineHeight || 18));
    more.textContent = `Show ${lines} lines`;
    more.onclick = () => {
      const folded = body.classList.toggle('clamp');
      more.textContent = folded ? `Show ${lines} lines` : 'Show less';
    };
    body.after(more);
  });
  return el;
}

// The editor shows one tab per question with a Submit that answers them together, so
// this does the same. There is no structured answer channel — a pending question takes
// an ordinary user turn — so Submit composes one message naming each question and the
// choice made, which is also what a person typing the answer would write.
function askForm(ask) {
  const wrap = document.createElement('div');
  const qs = ask.questions || [];
  const tabs = document.createElement('div');
  tabs.className = 'tabs';
  wrap.appendChild(tabs);

  const panes = qs.map((q, i) => {
    const tab = document.createElement('button');
    tab.className = 'tab' + (i === 0 ? ' on' : '');
    tab.innerHTML = `${esc(q.header || 'Question ' + (i + 1))}<span class="mark"></span>`;
    tabs.appendChild(tab);

    const pane = document.createElement('div');
    pane.className = 'pane' + (i === 0 ? ' on' : '');
    const multi = !!q.multiSelect;
    let h = `<div class="q">${esc(q.question)}</div>`;
    for (const o of (q.options || [])) {
      h += `<label class="opt"><input type="${multi ? 'checkbox' : 'radio'}" name="q${i}"` +
           ` value="${esc(o.label)}"><span class="txt"><b>${esc(o.label)}</b>` +
           `<span>${esc(o.description || '')}</span></span></label>`;
    }
    // Always offered, as in the editor: none of the options may fit.
    h += `<label class="opt"><input type="${multi ? 'checkbox' : 'radio'}" name="q${i}" value="__other__">` +
         `<span class="txt"><b>Other</b>` +
         `<input class="free" placeholder="Type your own answer…"></span></label>`;
    pane.innerHTML = h;
    wrap.appendChild(pane);

    tab.onclick = () => {
      tabs.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
      wrap.querySelectorAll('.pane').forEach(p => p.classList.remove('on'));
      tab.classList.add('on');
      pane.classList.add('on');
    };

    const sync = () => {
      pane.querySelectorAll('.opt').forEach(o =>
        o.classList.toggle('picked', o.querySelector('input').checked));
      tab.querySelector('.mark').textContent = answerOf(pane) ? '✓' : '';
    };
    pane.addEventListener('change', sync);
    // Typing in Other selects it, so the text cannot be silently ignored.
    pane.querySelector('.free').addEventListener('input', (e) => {
      const box = e.target.closest('.opt').querySelector('input');
      if (e.target.value.trim() && !box.checked) { box.checked = true; }
      sync();
    });
    return { q, pane };
  });

  const foot = document.createElement('div');
  foot.className = 'ask-foot';
  foot.innerHTML = '<button class="btn">Submit answers</button>' +
    '<span class="ask-hint">or type a reply below</span>';
  wrap.appendChild(foot);

  foot.querySelector('.btn').onclick = async () => {
    const answers = {};
    const parts = [];
    for (const { q, pane } of panes) {
      const a = answerOf(pane);
      if (!a) continue;
      answers[q.question] = a;
      parts.push(`${q.header || q.question}: ${a}`);
    }
    if (!parts.length) {
      foot.querySelector('.ask-hint').textContent = 'Pick at least one answer first.';
      return;
    }
    const hint = foot.querySelector('.ask-hint');
    hint.textContent = 'answering…';
    try {
      // Name the prompt being answered, so that the router answers exactly this one or
      // says it has gone. Unnamed, it answers whatever single prompt is waiting — and a
      // permission prompt handed these answers would take them as its approval. The
      // transcript this form was drawn from has no prompt id; the router's live prompt
      // does, and its questions say whether it is this one.
      const live = await fetchPrompt(current.session_id);
      if (live && live.pending && !live.question) {
        hint.textContent = 'Not sent: a permission prompt is waiting first — answer it, then this.';
        return;
      }
      if (live && live.pending && !sameQuestions(live, ask)) {
        hint.textContent = 'Not sent: a different question is waiting now.';
        return;
      }
      const named = live && live.pending && live.request_id ? { request_id: live.request_id } : {};
      const res = await fetch('/api/live/answer', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ session: current.session_id, answers, ...named })
      });
      const body = await res.json().catch(() => ({}));
      if (res.ok) {
        // Only now is the form spent: the prompt itself has been answered.
        wrap.closest('.ev').classList.add('done');
        wrap.querySelectorAll('input, .btn').forEach(x => { x.disabled = true; });
        hint.textContent = 'answered';
        return;
      }
      // Not answerable (unwrapped session, or the prompt already went) — the text is
      // still worth sending, and saying so beats losing what was typed.
      hint.textContent = body.reason || 'could not answer directly';
      deliver(parts.join('\n'), { ask: true });
    } catch (e) {
      hint.textContent = 'could not answer — ' + e;
    }
  };
  return wrap;
}

/// Whether a live prompt is the question a form was drawn for: the same questions, in
/// the same order. A prompt that does not list its questions is taken at its word.
function sameQuestions(p, ask) {
  const theirs = p.input && Array.isArray(p.input.questions) ? p.input.questions : null;
  if (!theirs) return true;
  const texts = qs => JSON.stringify(qs.map(q => q && q.question));
  return texts(theirs) === texts(ask.questions || []);
}

/// The chosen labels for one question, with Other replaced by what was typed.
function answerOf(pane) {
  const out = [];
  for (const box of pane.querySelectorAll('input[type=radio], input[type=checkbox]')) {
    if (!box.checked) continue;
    if (box.value === '__other__') {
      const free = box.closest('.opt').querySelector('.free').value.trim();
      if (free) out.push(free);
    } else out.push(box.value);
  }
  return out.join(', ');
}

function render(it) {
  const el = document.createElement('div');
  el.className = 'ev ' + it.kind
    + (it.role === 'user' && it.kind === 'text' ? ' user' : '')
    + (it.role === 'assistant' && it.kind === 'text' ? ' assistant-text' : '')
    + (it.sidechain ? ' sidechain' : '');
  const who = it.sidechain ? 'subagent' : it.role;
  const d = it.dur_ms != null && it.dur_ms > 400 ? `<span class="dur">${dur(it.dur_ms)}</span>` : '';

  if (it.kind === 'ask' && it.ask) {
    el.appendChild(askForm(it.ask));
    return el;
  } else if (it.kind === 'tool_use') {
    // Only a shell command earns a prompt glyph; a file path or a query is not typed.
    const shell = it.name === 'Bash';
    el.innerHTML = `<div class="who"><span class="name">${esc(it.name)}</span>${d}</div>` +
      `<div class="term ${shell ? '' : 'plain'}"><pre class="cmd">${esc(it.text)}</pre></div>`;
    return clampable(el);
  } else if (it.kind === 'tool_result') {
    el.innerHTML = `<div class="term"><div class="lbl">OUT</div><pre class="out">${esc(it.text)}</pre></div>`;
    return clampable(el);
  } else if (it.kind === 'thinking') {
    el.innerHTML = `<div class="who">Thought${it.dur_ms > 400 ? ' for ' + dur(it.dur_ms) : ''} ›</div>` +
      `<pre>${esc(it.text)}</pre>`;
    el.querySelector('.who').onclick = () => el.classList.toggle('open');
    return el;
  } else if (it.kind === 'aside') {
    el.innerHTML = `<div class="who">side answer${d}</div><div class="md">${md(it.text)}</div>`;
  } else if (it.kind === 'text' && it.role === 'assistant') {
    el.innerHTML = `<div class="who">${esc(who)}${d}</div><div class="md">${md(it.text)}</div>`;
  } else {
    const label = it.kind === 'answer' ? '✓ answered' : it.kind === 'command' ? '⌘ command' : esc(who);
    el.innerHTML = `<div class="who">${label}${d}</div><pre>${esc(it.text)}</pre>`;
  }
  return clampable(el);
}

/// Every session of this project, oldest first, as tabs.
function drawTabs(current) {
  const key = base(current.cwd) || current.project;
  const siblings = allRows
    .filter(x => (base(x.cwd) || x.project) === key)
    // Only what is current, plus whatever is open — a tab strip of every session this
    // project ever had is a worse index than the list it came from.
    .filter(x => x.session_id === current.session_id || (isCurrent(x) && !x.archived))
    // Creation order, so a tab keeps its position for the life of the session. Sorting
    // by activity would shuffle them every refresh, which is unusable as a tab strip.
    .sort((a, b) => (a.created_ms || a.last_activity_ms) - (b.created_ms || b.last_activity_ms));

  tabs.innerHTML = '';
  tabs.classList.toggle('hide', siblings.length < 2);
  if (siblings.length < 2) return;

  for (const x of siblings) {
    // The open session's tab says what its stream says, like the header beside it; the
    // others say what the list last read, which is at most five seconds old.
    const look = (x.session_id === current.session_id && lastStatus) || x;
    const t = document.createElement('button');
    t.className = 'stab' + (x.session_id === current.session_id ? ' on' : '');
    t.title = (x.title || x.session_id) + ' · ' + (look.detail || look.state || '');
    t.innerHTML = `<span class="dot ${toneClass(look)}"></span>` +
      `<span class="lbl">${esc(x.title || x.session_id.slice(0, 8))}</span>` +
      `<span class="put" title="Put this session away">✕</span>`;
    t.onclick = (e) => {
      if (e.target.classList.contains('put')) { e.stopPropagation(); putAway(x, true); return; }
      if (x.session_id !== current.session_id) openSession(x);
    };
    tabs.appendChild(t);
  }
  tabs.querySelector('.stab.on')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

/// Shelve a session, or bring it back, and redraw what depends on it.
async function putAway(row, archived) {
  try {
    const res = await fetch('/api/live/archive', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ session: row.session_id, archived })
    });
    if (!res.ok) { say('Could not archive that session.'); return; }
    row.archived = archived;
    if (current) drawTabs(current);
    if (!feed.classList.contains('hide')) return;
    const keep = list.scrollTop;
    await loadSessions();
    list.scrollTop = keep;
  } catch (e) { say('Could not archive — ' + e); }
}

// ---------- the stream ----------
/// How long an open stream may say nothing before it is taken for dead. The router speaks
/// on it at least once a second whatever the session is doing — a status heartbeat, even
/// for a session that has ended — so ten seconds of nothing is not a quiet session: it is
/// a connection that died without a word (a NAT that forgot it, a Mac that slept, a
/// network that went away), which the browser can take minutes to notice, if it ever
/// does. Until then its last status would stand as the present, frozen, with Stop beside
/// it. The phones give up on a silent stream after the same ten seconds.
const SILENCE_MS = 10000;
/// When the open stream last said anything, and whether the next thing it says starts a
/// new copy of the feed (see `connect`).
let heard = 0, fresh = false;

/// Listen to a session's stream: on opening it, and again whenever it has gone silent.
/// The router cannot pick a stream up where it left off, so it answers every connection —
/// the browser's own retry after an error included — by replaying the transcript's tail.
/// A connection that follows another therefore starts a new copy of the feed, rather than
/// appending the tail a second time; but only once it delivers something, not when it is
/// opened: while the link is down, what was already read stays on screen to be read.
function connect(r, again) {
  if (es) es.close();
  heard = Date.now();
  fresh = again;
  const src = new EventSource('/api/live/stream?session=' + encodeURIComponent(r.session_id));
  es = src;
  // Whether this is still the connection being listened to, noting that it spoke. One
  // that has been replaced is history, whatever it still delivers.
  const speaks = () => {
    if (src !== es) return false;
    heard = Date.now();
    if (fresh) { fresh = false; restart(); }
    return true;
  };
  src.onmessage = e => {
    if (!speaks()) return;
    try {
      const it = JSON.parse(e.data);
      // Everything this person already said in this session, so ArrowUp works the
      // moment the page opens instead of only after sending something.
      if (it.role === 'user' && it.kind === 'text' && it.text && !it.sidechain) {
        if (sent[sent.length - 1] !== it.text) sent.push(it.text);
        if (sent.length > 200) sent.shift();
      }
      const row = render(it);
      feed.appendChild(row);
      watcher?.observe(row);
    } catch {}
    if (following) pin();
  };
  src.addEventListener('status', e => {
    if (!speaks()) return;
    try { setStatus(JSON.parse(e.data)); } catch {}
  });
  // The browser retries on its own. The next status it brings clears this, and what it
  // brings first is the tail again, which replaces the rows rather than repeating them.
  src.addEventListener('error', () => {
    if (src !== es) return;
    fresh = true;
    markStale('reconnecting…');
  });
}

/// A new copy of the feed, for a connection about to replay the transcript's tail into
/// it — and the ArrowUp history, which that replay rebuilds.
function restart() {
  feed.innerHTML = '';
  sent = [];
  following = true;
  // The rows it was watching are gone; the replayed ones are observed as they land.
  watcher?.disconnect();
}

// A stream that has said nothing for SILENCE_MS is replaced: the header goes stale and
// Stop goes until the new connection speaks, and one that never does is retried every
// SILENCE_MS for as long as the session is open.
setInterval(() => {
  if (!current || !es) return;
  const now = Date.now();
  // A clock set back would otherwise read as a silence that has not begun yet.
  if (now < heard) heard = now;
  if (now - heard < SILENCE_MS) return;
  markStale('reconnecting…');
  connect(current, true);
}, 1000);

function openSession(r, fromHistory) {
  // Remember where the reader was in the list, so coming back does not dump them
  // somewhere else — the feed leaves the window scrolled to its own bottom.
  listScroll = list.scrollTop;
  current = r;
  // The open session lives in the URL, so a refresh comes back to it.
  if (!fromHistory) {
    const u = new URL(location.href);
    u.searchParams.set('session', r.session_id);
    history.pushState({ session: r.session_id }, '', u);
  }
  list.classList.add('hide');
  home.classList.add('hide');
  feed.classList.remove('hide');
  back.classList.remove('hide');
  composer.classList.remove('hide');
  heading.textContent = base(r.cwd) || r.project;
  // Another session's rows go at once; this one's arrive as its stream replays them.
  feed.innerHTML = '';
  sent = []; histAt = -1; histDraft = '';
  say('');
  feed.scrollTop = 0;
  // Until its stream speaks, the header has nothing true to say about this session —
  // and must not go on showing the list's summary as if it were this session's status.
  markStale('connecting…');
  promptCue = null;
  // A permission card belongs to the session it was drawn for; the next poll draws this
  // one's, if it has one.
  perm.replaceChildren(); permSeen = null;

  // Following is a state, not a per-append test. Rows change height *after* they are
  // appended — clampable() folds them a frame later — so a scroll issued at append
  // time lands short of the bottom and the view silently stops following.
  const atBottom = () => feed.scrollHeight - feed.scrollTop - feed.clientHeight < 140;
  following = true;
  feed.onscroll = () => { following = atBottom(); };
  watcher?.disconnect();
  // Observe the rows, not the scroller. #feed is flex:1, so its own box never changes
  // size — only its scrollHeight does — and a ResizeObserver on it fires almost never.
  // Rows do change: clampable() folds them a frame after they land, and that is exactly
  // when a pinned view slips off the bottom.
  watcher = new ResizeObserver(() => { if (following) pin(); });
  pinTo = feed;
  connect(r, false);

  // Totals need a whole-file scan, so they are fetched once per open rather than
  // pushed with every event.
  drawTabs(r);
  facts.classList.remove('hide');
  facts.innerHTML = '<span class="muted">reading totals…</span>';
  Promise.all([
    fetch('/api/live/stats?session=' + encodeURIComponent(r.session_id)).then(x => x.json()),
    // The project total answers a different question from the session's — "what is this
    // costing me overall" — so it sits apart, on the same strip.
    r.cwd ? fetch('/api/live/project?cwd=' + encodeURIComponent(r.cwd)).then(x => x.json())
          : Promise.resolve(null),
  ])
    .then(([t, p]) => {
      const model = (t.model || 'unknown').replace(/^claude-/, '');
      const bits = [`<span><b>${esc(model)}</b></span>`];
      if (t.effort) bits.push(`<span class="sep">·</span><span>effort <b>${esc(t.effort)}</b></span>`);
      bits.push(`<span class="sep">·</span><span><b>${num(t.total)}</b> tokens</span>`);
      bits.push(`<span class="sep">·</span><span>${num(t.output)} out · ${num(t.cache_read)} cached</span>`);
      bits.push(`<span class="sep">·</span><span>${t.turns} turn${t.turns === 1 ? '' : 's'}</span>`);
      if (t.cost != null) bits.push(`<span class="sep">·</span><span class="money"><b>${usd(t.cost)}</b></span>`);
      if (p && p.sessions > 1) {
        bits.push(`<span class="proj-tot">project · ${p.sessions} sessions · ` +
                  `<b>${num(p.total)}</b> tokens · ${p.turns} turns` +
                  (p.cost != null ? ` · <b class="money">${usd(p.cost)}</b>` : '') + `</span>`);
      }
      facts.innerHTML = bits.join(' ');
      // A wrapped session can be switched from here; a read-only one just says what it is.
      if (r.wrapped) facts.append(' ', switcher('model', t.model), ' ', switcher('effort', t.effort),
                                  ' ', switcher('mode', t.mode));
    })
    .catch(() => { facts.classList.add('hide'); });
}

/// A <select> that changes the session's model or effort. The choice takes effect on the
/// next turn, and the CLI's own notice — or refusal — is shown as the page's notice.
function switcher(kind, currentValue) {
  const sel = document.createElement('select');
  sel.className = 'sw';
  sel.title = kind === 'model' ? 'Switch the model for the next turn'
            : kind === 'effort' ? 'Set the effort level'
            : 'Change what this session stops to ask about';
  // Models and efforts are bare strings; modes carry their own labels, so that the
  // wording lives in the router and not in three clients.
  const modes = options.modes || [];
  const list = kind === 'model' ? options.models
             : kind === 'effort' ? options.efforts
             : modes.map(m => m.value);
  const labelOf = v => kind === 'mode' ? ((modes.find(m => m.value === v) || {}).label || v) : v;
  const cur = (currentValue || '').replace(/^claude-/, '');
  const values = [...new Set([cur, ...list].filter(Boolean))];
  for (const v of values) {
    const o = document.createElement('option');
    o.value = v; o.textContent = (v === cur ? kind + ': ' : '') + labelOf(v);
    if (v === cur) o.selected = true;
    sel.appendChild(o);
  }
  if (kind === 'model') {
    const o = document.createElement('option');
    o.value = '__other__'; o.textContent = 'other…';
    sel.appendChild(o);
  }
  sel.onchange = async () => {
    let value = sel.value;
    if (value === '__other__') { value = (prompt('Model name or alias (opus, sonnet[1m], a full id…)') || '').trim(); if (!value) { sel.value = cur; return; } }
    if (value === cur) return;
    // One tap here would otherwise stop this session asking about anything at all —
    // on a machine the person holding the phone may not be sitting at.
    if (kind === 'mode' && value === 'bypassPermissions' &&
        !confirm('Bypass permissions?\n\nThis session will stop asking before it runs commands or edits files.')) {
      sel.value = cur; return;
    }
    sel.disabled = true;
    try {
      const res = await fetch('/api/live/' + kind, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ session: current.session_id, [kind]: value })
      });
      const body = await res.json().catch(() => ({}));
      if (res.ok) say((body.notices && body.notices.join(' ')) || (body.pending ? `${kind} sent — the session has not confirmed yet` : `${kind} set to ${value} — takes effect on the next turn`), { ok: true, for: 6000 });
      else { say(body.reason || `Could not set the ${kind}.`); sel.value = cur; }
    } catch (e) { say(`Could not set the ${kind} — ` + e); sel.value = cur; }
    finally { sel.disabled = false; }
  };
  return sel;
}

// ---------- permission prompts ----------
// A permission request is a control frame between the CLI and its editor, not a
// transcript entry, so it can never arrive on the stream the feed is built from: it has
// to be asked for. A question (AskUserQuestion) is left alone here — that one *is* in
// the transcript, and askForm already renders it.
const perm = $('#perm');
let permSeen = null;

/// The newest prompt a session is blocked on, as the router lists it, or null. `count`
/// says how many are waiting in all; an answer names its prompt by `request_id`, so that
/// it lands on exactly that one or is refused as gone — never on whichever other one
/// happens to be waiting by then.
const fetchPrompt = id => fetch('/api/live/prompt?session=' + encodeURIComponent(id))
  .then(r => r.json()).catch(() => null);

function permSummary(input) {
  if (!input || typeof input !== 'object') return '';
  const one = input.command || input.file_path || input.path || input.url || input.pattern;
  return one ? String(one) : JSON.stringify(input);
}

function drawPerm(p) {
  perm.replaceChildren();
  const what = document.createElement('div');
  what.className = 'what';
  what.textContent = (p.display_name || p.tool || 'A tool') + ' is waiting for permission';
  perm.appendChild(what);
  // Answered one at a time, newest first: the next is drawn once this one is gone.
  if (p.count > 1) {
    const also = document.createElement('div');
    also.className = 'also';
    also.textContent = `${p.count - 1} more waiting after this one`;
    perm.appendChild(also);
  }
  if (p.description) {
    const d = document.createElement('div');
    d.textContent = p.description;
    perm.appendChild(d);
  }
  const body = permSummary(p.input);
  if (body) {
    const c = document.createElement('code');
    c.textContent = body.length > 400 ? body.slice(0, 400) + '…' : body;
    perm.appendChild(c);
  }
  const row = document.createElement('div');
  row.className = 'row';
  const button = (text, cls, body, done) => {
    const b = document.createElement('button');
    b.textContent = text;
    if (cls) b.className = cls;
    b.onclick = () => answerPerm({ ...body, request_id: p.request_id }, done, row);
    row.appendChild(b);
  };
  button('Allow', '', { allow: true }, 'Allowed.');
  // Only ever what this prompt offered; the router refuses anything else, and the
  // editor on the other end would drop it too.
  for (const s of p.suggestions || []) {
    button(s.label, '', { allow: true, suggestion: s.index }, s.label + '.');
  }
  button('Deny', 'deny', { allow: false, message: 'Declined from the live view.' }, 'Declined.');
  perm.appendChild(row);
}

async function answerPerm(body, done, row) {
  for (const b of row.querySelectorAll('button')) b.disabled = true;
  try {
    const res = await fetch('/api/live/answer', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ session: current.session_id, ...body })
    });
    const j = await res.json().catch(() => ({}));
    if (res.ok && j.ok !== false) { perm.replaceChildren(); permSeen = null; say(done, { ok: true, for: 5000 }); return; }
    say(j.reason || 'Could not answer that prompt.');
    // 409: that prompt is no longer waiting (answered elsewhere, or withdrawn). The card
    // can only fail again, so it is replaced by whatever is waiting now, if anything.
    if (res.status === 409) { permSeen = null; perm.replaceChildren(); pollPrompt(); return; }
    for (const b of row.querySelectorAll('button')) b.disabled = false;
  } catch (e) {
    say('Could not answer that prompt — ' + e);
    for (const b of row.querySelectorAll('button')) b.disabled = false;
  }
}

async function pollPrompt() {
  if (!current || feed.classList.contains('hide')) {
    if (permSeen) { perm.replaceChildren(); permSeen = null; }
    return;
  }
  const id = current.session_id;
  const p = await fetchPrompt(id);
  // A poll that fails is a poll that tries again in two seconds; one that comes back
  // after another session was opened is about a session no longer on screen.
  if (!p || !current || current.session_id !== id) return;
  if (!p.pending || p.question) {
    // Answered, withdrawn, or a question the feed itself renders.
    if (permSeen) { perm.replaceChildren(); permSeen = null; }
    return;
  }
  // Redrawn when the prompt changes, and when the number behind it does.
  const seen = p.request_id + '#' + (p.count || 1);
  if (permSeen !== seen) { permSeen = seen; drawPerm(p); }
}
setInterval(pollPrompt, 2000);

stopBtn.onclick = async () => {
  if (!current) return;
  stopBtn.disabled = true;
  try {
    const res = await fetch('/api/live/interrupt', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ session: current.session_id })
    });
    const body = await res.json().catch(() => ({}));
    if (res.ok) say('Stopped.', { ok: true, for: 4000 });
    else say(body.reason || 'Could not stop this session.');
  } catch (err) {
    say('Could not stop — ' + err);
  } finally { stopBtn.disabled = false; }
};

async function showList(fromHistory) {
  if (es) { es.close(); es = null; }
  current = null; lastStatus = null;
  feed.classList.add('hide'); back.classList.add('hide'); composer.classList.add('hide');
  facts.classList.add('hide'); tabs.classList.add('hide');
  list.classList.remove('hide');
  heading.textContent = 'Live sessions';
  say('');
  // Restore only after the rows are back, or there is nothing tall enough to scroll.
  home.classList.remove('hide');
  if (!fromHistory) {
    const u = new URL(location.href);
    u.searchParams.delete('session');
    history.pushState({}, '', u);
  }
  await loadSessions();
  list.scrollTop = listScroll;
}

back.onclick = () => showList(false);

// ---------- find ----------
// The feed can only ever show the tail of a transcript: the stream backfills a fixed
// number of bytes and there is no scrolling further up. The router's index has the whole
// of it, so this is the only way to reach a session's earlier turns from this page.
//
// Nothing here touches the stream. The feed stays connected and keeps receiving while
// the results are on screen, so coming back from a search does not lose the live view.
// `findPane`, not `find`: a top-level `const find` would shadow window.find, and
// `scopeRow` rather than leaning on the id-as-global for a name this common.
const findPane = $('#find'), scopeRow = $('#scope');
const qbox = $('#q'), findRows = $('#findRows'), findBtn = $('#findBtn');
let findOpen = false, findScope = 'session', findTimer = 0, findSeq = 0;

// Split on the pair rather than substituting into it: a marker the conversation itself
// contained can then only mis-highlight, never leave a tag open and swallow the rest.
const findMark = t => String(t ?? '').split(/[\u2039\u203a]/)
  .map((part, i) => (i % 2 ? '<mark>' + esc(part) + '</mark>' : esc(part))).join('');

const KIND_NAME = { text: 'message', tool_use: 'tool call', tool_result: 'tool result',
                    thinking: 'thinking', system: 'system prompt' };

function openFind() {
  findOpen = true;
  // Scoping to the open session is the point of having this here rather than on the
  // dashboard; with no session open there is nothing to scope to.
  findScope = current ? 'session' : 'all';
  drawScope();
  list.classList.add('hide'); feed.classList.add('hide'); composer.classList.add('hide');
  tabs.classList.add('hide'); facts.classList.add('hide'); home.classList.add('hide');
  back.classList.remove('hide');
  findPane.classList.remove('hide');
  heading.textContent = 'Find';
  qbox.focus(); qbox.select();
  runFind();
}

function closeFind() {
  findOpen = false;
  findPane.classList.add('hide');
  if (current) {
    feed.classList.remove('hide'); composer.classList.remove('hide');
    facts.classList.remove('hide');
    // Redrawn rather than merely shown: the refreshes skipped it while it was hidden,
    // and a project with one session on screen has no strip to show at all.
    drawTabs(current);
    back.classList.remove('hide');
    heading.textContent = base(current.cwd) || current.project;
    pin();
  } else {
    list.classList.remove('hide'); home.classList.remove('hide');
    back.classList.add('hide');
    heading.textContent = 'Live sessions';
  }
}

function drawScope() {
  for (const b of scopeRow.querySelectorAll('button')) {
    b.setAttribute('aria-pressed', String(b.dataset.s === findScope));
    // With no session open there is nothing to narrow to.
    b.disabled = b.dataset.s === 'session' && !current;
  }
  qbox.placeholder = findScope === 'session' && current
    ? 'Find anywhere in this session' : 'Find in every session';
}

findBtn.onclick = () => (findOpen ? closeFind() : openFind());
scopeRow.onclick = e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  findScope = b.dataset.s;
  drawScope();
  runFind();
};
qbox.addEventListener('input', () => { clearTimeout(findTimer); findTimer = setTimeout(runFind, 200); });
addEventListener('keydown', e => { if (e.key === 'Escape' && findOpen) closeFind(); });

async function runFind() {
  const q = qbox.value.trim(), seq = ++findSeq;
  if (!q) { findRows.innerHTML = ''; return; }
  const p = new URLSearchParams({ q, limit: '30' });
  if (findScope === 'session' && current) p.set('session', current.session_id);
  let d;
  try {
    d = await fetch('/api/search?' + p).then(r => r.json());
  } catch {
    if (seq === findSeq) findRows.innerHTML = '<div class="findnote">Could not reach the router.</div>';
    return;
  }
  if (seq !== findSeq) return;  // a later keystroke has already answered
  drawFind(d, q);
}

function drawFind(d, q) {
  const hits = d.hits || [];
  if (!hits.length) {
    findRows.innerHTML = '<div class="findnote">Nothing matched ' + esc(q)
      + (findScope === 'session' ? ' in this session.' : '.') + '</div>';
    return;
  }
  const parts = [];
  // Only worth saying when the router ran something other than what was typed.
  if (d.expression && d.expression !== q) {
    parts.push('<div class="findnote">Searched for ' + esc(d.expression) + '</div>');
  }
  for (const h of hits) {
    // A hit already in the open session has nowhere to go — the feed cannot scroll to a
    // turn it never loaded — so only a hit elsewhere is a link.
    const elsewhere = !current || h.session_id !== current.session_id;
    parts.push(
      '<div class="hit' + (elsewhere ? ' open' : '') + '"' +
      (elsewhere ? ' data-open="' + esc(h.session_id) + '"' : '') + '>' +
        '<div class="top">' +
          '<span class="tag">' + esc(KIND_NAME[h.kind] || h.kind) + '</span>' +
          '<span>' + esc(h.role || '') + '</span>' +
          '<span class="sp"></span>' +
          '<span>' + ago(h.at) + '</span>' +
        '</div>' +
        '<div class="snip">' + findMark(h.snippet) + '</div>' +
        (elsewhere ? '<div class="top">' + esc(base(h.project) || '—') + ' · '
                   + esc(String(h.session_id).slice(0, 8)) + ' · open</div>' : '') +
      '</div>');
  }
  findRows.innerHTML = parts.join('');
}

findRows.onclick = async e => {
  const card = e.target.closest('.hit[data-open]');
  if (!card) return;
  const id = card.dataset.open;
  const rows = await fetchSessions();
  const row = rows.find(r => r.session_id === id);
  if (!row) { say('That session is no longer listed.'); return; }
  closeFind();
  openSession(row, false);
};

// Browser back moves between the list and a session rather than leaving the page.
addEventListener('popstate', async (e) => {
  const id = e.state?.session || new URL(location.href).searchParams.get('session');
  if (!id) return showList(true);
  const rows = await fetchSessions();
  const row = rows.find(r => r.session_id === id);
  if (row) openSession(row, true); else showList(true);
});

msg.addEventListener('input', () => {
  msg.style.height = 'auto';
  msg.style.height = Math.min(msg.scrollHeight, 120) + 'px';
});
msg.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); return; }
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  if (!sent.length) return;

  // Only take the arrow when the caret is on the edge it would leave, so a multi-line
  // draft can still be navigated normally.
  const atStart = msg.selectionStart === 0 && msg.selectionEnd === 0;
  const atEnd = msg.selectionStart === msg.value.length && msg.selectionEnd === msg.value.length;
  if (e.key === 'ArrowUp' && !atStart) return;
  if (e.key === 'ArrowDown' && !atEnd) return;

  if (e.key === 'ArrowUp') {
    if (histAt === -1) { histDraft = msg.value; histAt = sent.length; }
    if (histAt === 0) return;
    histAt--;
  } else {
    if (histAt === -1) return;
    histAt++;
  }
  e.preventDefault();
  // Past the newest entry is the draft you were writing when you started browsing.
  msg.value = histAt >= sent.length ? (histAt = -1, histDraft) : sent[histAt];
  msg.style.height = 'auto';
  msg.style.height = Math.min(msg.scrollHeight, 120) + 'px';
  const end = msg.value.length;
  msg.setSelectionRange(end, end);
});

async function deliver(text, opts = {}) {
  if (!text || !current) return;
  sendBtn.disabled = true;
  try {
    const res = await fetch('/api/live/send', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ session: current.session_id, text })
    });
    const body = await res.json().catch(() => ({}));
    if (res.ok) {
      // Echo it immediately. The real row arrives later, when the session writes the
      // message to its transcript — which on a busy session can be minutes. Without
      // this, a successful send looks identical to a broken one.
      const echo = document.createElement('div');
      echo.className = 'ev text user pending';
      echo.innerHTML = '<div class="who">you · queued</div><pre></pre>';
      echo.querySelector('pre').textContent = text;
      feed.appendChild(echo);
      watcher?.observe(echo);
      following = true;
      pin();
      msg.value = ''; msg.style.height = 'auto';
      if (body.framed) {
        // Worth interrupting for: the session will see a teammate's request, not yours,
        // and will often ask who sent it instead of just doing the thing.
        say('Sent, but as a peer message — this session will see it as coming from another '
          + 'Claude, not from you. Install the wrapper in Settings and restart the session for '
          + 'it to arrive as your own message.');
      } else {

        // Measured: a queued user turn does NOT satisfy a pending AskUserQuestion. The
        // session is blocked on a control_response for that tool call, and this message
        // waits behind it. Saying "delivered" here would be true and misleading.
        if (opts.ask) say('Sent as a message — it may not dismiss the prompt.');
        else say('Delivered as your message.', { ok: true, for: 4000 });
      }
    } else {
      say(body.reason || ('Send failed (' + res.status + ')'));
    }
  } catch (err) {
    say('Send failed — ' + err);
  } finally { sendBtn.disabled = false; }
}

sendBtn.onclick = () => deliver(msg.value.trim());

// A side question: answered with the session's context, in a fork the session never
// sees — what /btw does, which the editor's stream refuses. Shown here only.
const btwBtn = document.createElement('button');
btwBtn.id = 'btw'; btwBtn.className = 'btn ghost'; btwBtn.textContent = 'btw';
btwBtn.title = 'Ask a quick side question without interrupting the session';
stopBtn.after(btwBtn);
btwBtn.onclick = async () => {
  if (!current) return;
  const q = (msg.value.trim() || prompt('Side question — answered from this session\'s context, without interrupting it') || '').trim();
  if (!q) return;
  btwBtn.disabled = true;
  const asked = render({ role: 'user', kind: 'text', text: q });
  asked.classList.add('pending'); asked.querySelector('.who').textContent = 'you · side question';
  feed.appendChild(asked); following = true; pin();
  msg.value = ''; msg.style.height = 'auto';
  say('asking on the side — this replays the session once, usually under a minute', { ok: true });
  try {
    const res = await fetch('/api/live/aside', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ session: current.session_id, text: q }) });
    const body = await res.json().catch(() => ({}));
    if (res.ok) {
      feed.appendChild(render({ role: 'assistant', kind: 'aside', text: body.answer || '(no answer)' }));
      say(`answered in ${dur(body.took_ms || 0)}${body.cost != null ? ' · ' + usd(body.cost) : ''}`, { ok: true, for: 6000 });
      pin();
    } else say(body.reason || 'The side question failed.');
  } catch (e) { say('Side question failed — ' + e); }
  finally { btwBtn.disabled = false; }
};

// iOS ignores interactive-widget and overlays the keyboard instead of resizing the
// layout, so dvh alone still leaves the composer underneath it. The visual viewport is
// the one thing that does shrink, so the shell is pinned to that when it is available.
const vv = window.visualViewport;
if (vv) {
  let raf = 0;
  const fit = () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      document.body.style.height = vv.height + 'px';
      // Keep the newest message in view when the keyboard takes half the screen.
      if (!feed.classList.contains('hide')) feed.scrollTop = feed.scrollHeight;
    });
  };
  vv.addEventListener('resize', fit);
  vv.addEventListener('scroll', fit);
  fit();
}

(async () => {
  await loadSessions();
  // A refresh lands back on the session that was open.
  const want = new URL(location.href).searchParams.get('session');
  if (!want) return;
  const rows = await fetchSessions();
  const row = rows.find(r => r.session_id === want);
  if (row) openSession(row, true);
})();

// Not skipped while a session is open: loadSessions then redraws only the tab strip,
// whose dots would otherwise keep the states they had when the session was opened.
setInterval(() => {
  const keep = list.scrollTop;
  loadSessions().then(() => { if (!current) list.scrollTop = keep; });
}, 5000);
</script>
