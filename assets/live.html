<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live sessions · Agent Router</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --fg: #e6e9ef; --dim: #9aa3b2; --faint: #6b7484;
    --accent: #7aa2f7; --warn: #e0af68; --ok: #9ece6a; --ask: #bb9af7;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #fff; --panel2: #f0f2f5; --line: #dfe3e8;
      --fg: #171a21; --dim: #5b6472; --faint: #8b94a3;
      --accent: #2d5bd7; --warn: #9a6700; --ok: #2c7a2c; --ask: #7a3fbf;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 15px/1.5 ui-sans-serif, -apple-system, system-ui, "Segoe UI", sans-serif; }
  header {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
    padding: 10px 14px; padding-top: calc(10px + env(safe-area-inset-top));
    display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: -0.01em;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sp { flex: 1; }
  button { font: inherit; color: var(--fg); background: var(--panel2);
           border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; cursor: pointer; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  /* ---- status pill: what the session is doing right now ---- */
  #stat { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim);
          white-space: nowrap; flex: none; }
  #stat .pip { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  #stat.working .pip, #stat.tool .pip { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  #stat.ask .pip { background: var(--ask); animation: pulse .8s ease-in-out infinite; }
  #stat.idle .pip { background: var(--ok); }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.75); } }
  @media (prefers-reduced-motion: reduce) { #stat .pip { animation: none !important; } }

  #list { padding: 12px; display: grid; gap: 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 12px 13px; cursor: pointer; display: grid; gap: 5px; }
  .card:active { background: var(--panel2); }
  .row1 { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
  .proj { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ago { margin-left: auto; color: var(--faint); font-size: 12px; flex: none; }
  .title { color: var(--dim); font-size: 13px; overflow: hidden;
           display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .meta { color: var(--faint); font-size: 11.5px; font-family: ui-monospace, Menlo, monospace; }

  /* ---- transcript ---- */
  #feed { padding: 12px 12px 8px; display: grid; gap: 9px; }
  .ev { border-radius: 10px; padding: 10px 12px; border: 1px solid var(--line); background: var(--panel); }
  .ev .who { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
             color: var(--faint); margin-bottom: 4px; display: flex; gap: 7px; align-items: baseline; }
  .ev .dur { margin-left: auto; text-transform: none; letter-spacing: 0; }
  .ev pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere;
            font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .ev.user { border-left: 3px solid var(--accent); }
  .ev.text pre { font-family: inherit; font-size: 14.5px; }
  .ev.thinking { background: transparent; border-style: dashed; }
  .ev.thinking pre { color: var(--dim); font-style: italic; }
  .ev.tool_use { background: var(--panel2); }
  .ev.tool_use .name { color: var(--accent); font-weight: 600; text-transform: none;
                       letter-spacing: 0; font-size: 12.5px; }
  .io { display: grid; grid-template-columns: auto 1fr; gap: 6px 8px; align-items: start; margin-top: 2px; }
  .io b { font-size: 10px; color: var(--faint); font-weight: 600; padding-top: 3px; }
  .ev.tool_result pre { color: var(--dim); max-height: 8.5em; overflow: hidden; }
  .ev.sidechain { margin-left: 14px; border-left: 2px solid var(--warn); }
  .ev.ask { border-color: var(--ask); background: color-mix(in srgb, var(--ask) 10%, var(--panel)); }
  .ev.ask .q { font-weight: 600; margin: 6px 0 8px; font-size: 14.5px; }
  .ev.ask .hdr { display: inline-block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
                 color: var(--ask); border: 1px solid var(--ask); border-radius: 999px; padding: 1px 7px; }
  .opt { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; background: var(--panel); }
  .opt b { font-size: 13.5px; }
  .opt span { display: block; color: var(--dim); font-size: 12.5px; margin-top: 2px; }
  .ev.answer { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 9%, var(--panel)); }

  /* ---- composer ---- */
  #composer {
    position: sticky; bottom: 0; background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(12px); border-top: 1px solid var(--line);
    padding: 10px 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
    display: grid; gap: 7px;
  }
  .cbox { display: flex; gap: 8px; align-items: flex-end; }
  #msg { flex: 1; resize: none; font: inherit; color: var(--fg); background: var(--panel);
         border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; max-height: 120px; }
  #msg:disabled { color: var(--faint); }
  #note { font-size: 11.5px; color: var(--warn); }
  #note.ok { color: var(--ok); }
  /* Stop takes the send button's place while a turn is running, as in the real UI. */
  #stop { background: var(--warn); border-color: var(--warn); color: #1a1200; font-weight: 600; }
  .ev.pending { opacity: .6; border-style: dashed; border-left: 3px solid var(--accent); }
  .empty { color: var(--faint); text-align: center; padding: 40px 20px; }
  .hide { display: none !important; }
</style>

<header>
  <button id="back" class="hide">‹</button>
  <h1 id="heading">Live sessions</h1>
  <span class="sp"></span>
  <span id="stat"><span class="pip"></span><span id="statText"></span></span>
</header>

<div id="list"></div>
<div id="feed" class="hide"></div>

<div id="composer" class="hide">
  <div class="cbox">
    <textarea id="msg" rows="1" placeholder="Send a message to this session…"></textarea>
    <button id="send">Send</button>
    <button id="stop" class="hide" title="Stop this turn">■</button>
  </div>
  <div id="note"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const list = $('#list'), feed = $('#feed'), back = $('#back'), heading = $('#heading');
const stat = $('#stat'), statText = $('#statText'), composer = $('#composer');
const msg = $('#msg'), sendBtn = $('#send'), note = $('#note'), stopBtn = $('#stop');
let es = null, current = null, listScroll = 0;

const dur = ms => ms < 1000 ? Math.round(ms) + 'ms'
  : ms < 60000 ? (ms / 1000).toFixed(ms < 10000 ? 1 : 0) + 's'
  : Math.round(ms / 60000) + 'm';
const ago = ms => {
  const s = Math.max(0, (Date.now() - ms) / 1000);
  return s < 60 ? Math.round(s) + 's' : s < 3600 ? Math.round(s / 60) + 'm'
    : s < 86400 ? Math.round(s / 3600) + 'h' : Math.round(s / 86400) + 'd';
};
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const base = p => (p || '').split('/').filter(Boolean).pop() || p || '—';

function setStatus(s) {
  stat.className = s ? s.state : '';
  // Stop is only meaningful while something is running, and only a wrapped session can
  // be interrupted — so an unwrapped one keeps Send and finds out on click.
  const busy = !!s && (s.state === 'tool' || s.state === 'working');
  stopBtn.classList.toggle('hide', !busy);
  sendBtn.classList.toggle('hide', busy);
  if (!s) { statText.textContent = ''; return; }
  const quiet = s.quiet_ms > 4000 ? ' · ' + dur(s.quiet_ms) : '';
  statText.textContent = s.detail + quiet;
}

async function loadSessions() {
  let rows = [];
  try { rows = await (await fetch('/api/live/sessions')).json(); }
  catch { stat.className = ''; statText.textContent = 'offline'; return; }
  statText.textContent = rows.filter(r => r.active).length + ' active';
  list.innerHTML = rows.length ? '' : '<div class="empty">No sessions in the last week.</div>';
  for (const r of rows) {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML =
      `<div class="row1"><span class="dot ${r.active ? 'on' : ''}"></span>` +
      `<span class="proj">${esc(base(r.cwd) || r.project)}</span>` +
      `<span class="ago">${ago(r.last_activity_ms)}</span></div>` +
      (r.title ? `<div class="title">${esc(r.title)}</div>` : '') +
      `<div class="meta">${esc(r.session_id.slice(0, 8))}${r.git_branch ? ' · ' + esc(r.git_branch) : ''}</div>`;
    el.onclick = () => openSession(r);
    list.appendChild(el);
  }
}

function render(it) {
  const el = document.createElement('div');
  el.className = 'ev ' + it.kind + (it.role === 'user' && it.kind === 'text' ? ' user' : '')
    + (it.sidechain ? ' sidechain' : '');
  const who = it.sidechain ? 'subagent' : it.role;
  const d = it.dur_ms != null && it.dur_ms > 400 ? `<span class="dur">${dur(it.dur_ms)}</span>` : '';

  if (it.kind === 'ask' && it.ask) {
    let h = `<div class="who">⁇ ${esc(who)} is asking${d}</div>`;
    for (const q of (it.ask.questions || [])) {
      h += q.header ? `<span class="hdr">${esc(q.header)}</span>` : '';
      h += `<div class="q">${esc(q.question)}</div>`;
      for (const o of (q.options || [])) h += `<div class="opt"><b>${esc(o.label)}</b><span>${esc(o.description)}</span></div>`;
    }
    el.innerHTML = h;
  } else if (it.kind === 'tool_use') {
    el.innerHTML = `<div class="who"><span class="name">${esc(it.name)}</span>${d}</div>` +
      `<div class="io"><b>IN</b><pre>${esc(it.text)}</pre></div>`;
  } else if (it.kind === 'tool_result') {
    el.innerHTML = `<div class="io"><b>OUT</b><pre>${esc(it.text)}</pre></div>`;
  } else {
    const label = it.kind === 'answer' ? '✓ answered'
      : it.kind === 'thinking' ? `Thought${it.dur_ms > 400 ? ' for ' + dur(it.dur_ms) : ''}`
      : esc(who);
    el.innerHTML = `<div class="who">${label}${it.kind === 'thinking' ? '' : d}</div><pre>${esc(it.text)}</pre>`;
  }
  return el;
}

function openSession(r) {
  // Remember where the reader was in the list, so coming back does not dump them
  // somewhere else — the feed leaves the window scrolled to its own bottom.
  listScroll = window.scrollY;
  current = r;
  list.classList.add('hide');
  feed.classList.remove('hide');
  back.classList.remove('hide');
  composer.classList.remove('hide');
  heading.textContent = base(r.cwd) || r.project;
  feed.innerHTML = '';
  note.textContent = ''; note.className = '';
  window.scrollTo(0, 0);
  if (es) es.close();

  const atBottom = () => window.innerHeight + window.scrollY >= document.body.offsetHeight - 140;
  es = new EventSource('/api/live/stream?session=' + encodeURIComponent(r.session_id));
  es.onmessage = e => {
    const stick = atBottom();
    try { feed.appendChild(render(JSON.parse(e.data))); } catch {}
    if (stick) window.scrollTo(0, document.body.scrollHeight);
  };
  es.addEventListener('status', e => { try { setStatus(JSON.parse(e.data)); } catch {} });
  es.addEventListener('error', () => { stat.className = ''; statText.textContent = 'reconnecting…'; });
}

stopBtn.onclick = async () => {
  if (!current) return;
  stopBtn.disabled = true;
  try {
    const res = await fetch('/api/live/interrupt', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ session: current.session_id })
    });
    const body = await res.json().catch(() => ({}));
    note.className = res.ok ? 'ok' : '';
    note.textContent = res.ok ? 'Stopped.' : (body.reason || 'Could not stop this session.');
  } catch (err) {
    note.className = ''; note.textContent = 'Could not stop — ' + err;
  } finally { stopBtn.disabled = false; }
};

back.onclick = async () => {
  if (es) { es.close(); es = null; }
  current = null;
  feed.classList.add('hide'); back.classList.add('hide'); composer.classList.add('hide');
  list.classList.remove('hide');
  heading.textContent = 'Live sessions';
  note.textContent = '';
  // Restore only after the rows are back, or there is nothing tall enough to scroll.
  await loadSessions();
  window.scrollTo(0, listScroll);
};

msg.addEventListener('input', () => {
  msg.style.height = 'auto';
  msg.style.height = Math.min(msg.scrollHeight, 120) + 'px';
});
msg.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); }
});

sendBtn.onclick = async () => {
  const text = msg.value.trim();
  if (!text || !current) return;
  sendBtn.disabled = true;
  try {
    const res = await fetch('/api/live/send', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ session: current.session_id, text })
    });
    const body = await res.json().catch(() => ({}));
    if (res.ok) {
      // Echo it immediately. The real row arrives later, when the session writes the
      // message to its transcript — which on a busy session can be minutes. Without
      // this, a successful send looks identical to a broken one.
      const echo = document.createElement('div');
      echo.className = 'ev text user pending';
      echo.innerHTML = '<div class="who">you · queued</div><pre></pre>';
      echo.querySelector('pre').textContent = text;
      feed.appendChild(echo);
      window.scrollTo(0, document.body.scrollHeight);
      msg.value = ''; msg.style.height = 'auto';
      if (body.framed) {
        // Worth interrupting for: the session will see a teammate's request, not yours,
        // and will often ask who sent it instead of just doing the thing.
        note.className = '';
        note.textContent = 'Sent, but as a peer message — this session will see it as coming from '
          + 'another Claude, not from you. Install the wrapper in Settings and restart the session '
          + 'for it to arrive as your own message.';
      } else {
        note.className = 'ok';
        note.textContent = 'Delivered as your message.';
        setTimeout(() => { if (note.className === 'ok') note.textContent = ''; }, 5000);
      }
    } else {
      note.className = '';
      note.textContent = body.reason || ('Send failed (' + res.status + ')');
    }
  } catch (err) {
    note.className = '';
    note.textContent = 'Send failed — ' + err;
  } finally { sendBtn.disabled = false; }
};

loadSessions();
setInterval(() => {
  if (!feed.classList.contains('hide')) return;
  const keep = window.scrollY;
  loadSessions().then(() => window.scrollTo(0, keep));
}, 5000);
</script>
