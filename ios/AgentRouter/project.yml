# The Xcode project is generated from this file: `xcodegen generate` (brew install xcodegen).
# The .xcodeproj itself is not committed — it is a build artefact of this spec.
name: AgentRouter
options:
  bundleIdPrefix: ca.whnet
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: true
    # Supplied by the environment so the team id stays out of the repo; xcodegen
    # expands ${...} unless you pass --no-env. Export DEVELOPMENT_TEAM before
    # generating — see "Building the iPhone app" in the README.
    #
    # The id in parentheses on the signing certificate is the PERSON, not the team.
    # Pointing this at that id is what makes Xcode report "No profiles found".
    # With no Apple ID signed into Xcode, automatic signing still works offline
    # provided the team's wildcard development profile is on the Mac and lists the
    # phone.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
targets:
  AgentRouter:
    type: application
    platform: iOS
    sources:
      - Sources
    # Push needs the capability on the App ID; automatic signing adds it when an Apple
    # ID is signed into Xcode. Without one, build with CODE_SIGN_ENTITLEMENTS= (empty) and
    # the app runs without notifications, saying so in Settings.
    entitlements:
      path: Sources/AgentRouter.entitlements
      properties:
        aps-environment: development
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Agent Router
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # The router wakes the app with a silent push when a prompt has been answered
        # elsewhere, so the banner it raised can be taken down.
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Routers on the LAN may speak plain HTTP, and both keys below are for them: the
        # local-network prompt and the exception for plain HTTP to local addresses. Hosted
        # routers use HTTPS, which needs neither.
        NSLocalNetworkUsageDescription: Agent Router connects to routers running on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        # The team the app is signed under, as `TEAMID.` — sent to the router when the
        # phone registers, so an APNs key dropped beside the router needs nothing typed.
        AppIdentifierPrefix: "$(AppIdentifierPrefix)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.whnet.agent-router
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: true
  AgentRouterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: AgentRouter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.whnet.agent-router.tests
        # Unsigned on the simulator; on a device pass CODE_SIGNING_ALLOWED=YES, and the
        # generated Info.plist is what lets the bundle be signed there.
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
  AgentRouterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: AgentRouter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.whnet.agent-router.uitests
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: AgentRouter
schemes:
  AgentRouter:
    build:
      targets:
        AgentRouter: all
        AgentRouterTests: [test]
        AgentRouterUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgentRouterTests
        - AgentRouterUITests
